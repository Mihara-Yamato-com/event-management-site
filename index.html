<meta charset="utf-8">
<title>ACTIO — イベント主催・管理サービス</title>

<style>
/* ============================================================
   デザイントークン — 仕様書.md 9章「デザイントークン」が唯一の正
   値をここで独自に変えないこと
   ============================================================ */
:root {
  /* 基本 — 白基調（Issue #3）。面は白で統一し、境界は罫線で切る */
  --color-bg:            #FFFFFF;
  --color-surface:       #FFFFFF;
  --color-surface-sub:   #F4F5F7;   /* ホバー・アクティブ・プレースホルダ面 */
  --color-canvas:        #FAFAFB;   /* 管理画面のコンテンツ地。白との差はごく薄く */
  --color-border:        #E5E7EB;
  --color-text:          #16181D;
  --color-text-muted:    #6B7280;

  /* アクセント */
  --color-accent:        #16181D;
  --color-accent-text:   #FFFFFF;

  /* ロゴマーク（Issue #2 画像1） */
  --color-mark-facet:    #2C3440;
  --color-mark-accent:   #8DA5C4;

  /* 濃色面（参加者トップのヒーロー・オーバーレイ） */
  --color-hero-bg:       #1D222B;
  --color-hero-from:     #232936;
  --color-hero-to:       #454F63;
  --color-on-dark:       #FFFFFF;   /* 濃色面の上に載せる文字・図形 */
  --color-overlay:       rgba(22,24,29,.35);   /* モーダルの背面 */
  --color-overlay-strong: rgba(22,24,29,.82);  /* 画像の上に載せるバッジ */
  --color-hero-scrim:    rgba(22,24,29,.62);   /* ヘッダー画像を暗く落とす膜 */

  /* セマンティック */
  --color-success-bg:    #E4F1E5;  --color-success-text: #2E7D40;
  --color-warning-bg:    #FBF1DA;  --color-warning-text: #96792A;
  --color-neutral-bg:    #F1F2F4;  --color-neutral-text: #5B616E;
  --color-danger-bg:     #FBE6E3;  --color-danger-text:  #B23B2C;

  /* 可視化 */
  --color-progress:      #4CAF6D;
  --color-chart-line:    #4A7BC8;
  --color-chart-grid:    #EDEEF1;

  /* 余白 */
  --space-xs: 4px;   --space-sm: 8px;   --space-md: 12px;
  --space-lg: 16px;  --space-xl: 24px;  --space-2xl: 32px; --space-3xl: 48px;

  /* 角丸 */
  --radius-sm: 4px;  --radius-md: 6px;  --radius-lg: 10px;  --radius-full: 9999px;

  /* タイポグラフィ */
  --font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-size-xs: 12px;  --font-size-sm: 13px;  --font-size-md: 14px;
  --font-size-lg: 16px;  --font-size-xl: 20px;  --font-size-2xl: 28px;
  --font-size-display: 40px;
  --font-weight-normal: 400; --font-weight-medium: 500; --font-weight-bold: 700;
  --line-height: 1.7;

  /* 境界・影 */
  --border:    1px solid var(--color-border);
  --shadow-sm: 0 1px 2px rgba(22,24,29,.05);
  --shadow-md: 0 6px 20px rgba(22,24,29,.08);

  /* レイアウト */
  --sidebar-width: 200px;
  --ecard-width: 272px;      /* 参加者トップのカード幅。件数で伸縮させない（Issue #8） */
  --content-max-width: 1200px;
  --header-height: 56px;
}

* { box-sizing: border-box; }

html { scrollbar-gutter: stable; }   /* スクロールバーの有無で幅が変わらないようにする（Issue #9） */

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-family);
  font-size: var(--font-size-md);
  line-height: var(--line-height);
}

a { color: inherit; }

/* ---------- レイアウト（左サイドバー固定＋右コンテンツ） ---------- */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-width);
  flex: 0 0 var(--sidebar-width);
  background: var(--color-surface);
  border-right: var(--border);
  padding: var(--space-xl) var(--space-md);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.sidebar__brand {
  padding: 0 var(--space-sm) var(--space-2xl);
  text-decoration: none;
  color: inherit;
  display: block;
}

.logo { display: inline-flex; align-items: center; gap: var(--space-sm); }
.logo__word {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-medium);
  letter-spacing: .22em;
  line-height: 1;
}

.sidebar__nav { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; }

.sidebar__link {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-md);
  text-decoration: none;
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}
.sidebar__link:hover { background: var(--color-surface-sub); color: var(--color-text); }
.sidebar__link--active {
  background: var(--color-surface-sub);
  color: var(--color-text);
  font-weight: var(--font-weight-medium);
}

.sidebar__caret {
  font-family: inherit;
  margin-left: auto;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  opacity: .6;
  font-size: var(--font-size-xs);
  line-height: 1;
  padding: var(--space-xs);
  border-radius: var(--radius-sm);
}
.sidebar__caret:hover { opacity: 1; background: var(--color-border); }

.sidebar__sub {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin: 2px 0 var(--space-sm);
  padding-left: var(--space-2xl);
  border-left: var(--border);
  margin-left: var(--space-lg);
}
.sidebar__sublink {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  text-decoration: none;
  padding: var(--space-xs) var(--space-sm);
  border-radius: var(--radius-sm);
}
.sidebar__sublink:hover { background: var(--color-surface-sub); color: var(--color-text); }
.sidebar__sublink.is-active { color: var(--color-text); font-weight: var(--font-weight-medium); }

.sidebar__foot {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-sm) 0;
  border-top: var(--border);
  min-width: 0;
}
.sidebar__org { min-width: 0; }
.sidebar__orgname {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar__orgnote { font-size: var(--font-size-xs); color: var(--color-text-muted); }

.avatar {
  width: 28px; height: 28px;
  flex: 0 0 28px;
  border-radius: var(--radius-full);
  object-fit: cover;
  background: var(--color-surface-sub);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.avatar--text {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  color: var(--color-text-muted);
}

/* 画像2 の「FEATURED EVENT」のような小さな英字ラベル */
.eyebrow {
  font-size: var(--font-size-xs);
  letter-spacing: .18em;
  color: var(--color-text-muted);
  text-transform: uppercase;
  margin-bottom: var(--space-sm);
}

.mainwrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.apphead {
  height: var(--header-height);
  flex: 0 0 var(--header-height);
  border-bottom: var(--border);
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-2xl);
  position: sticky;
  top: 0;
  z-index: 20;
}
.apphead__brand {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-weight: var(--font-weight-medium);
}
.apphead__logo { height: 24px; width: auto; border-radius: var(--radius-sm); }
.apphead__actions { display: flex; gap: var(--space-lg); }
.apphead__link {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  text-decoration: none;
  padding-bottom: 2px;
  border-bottom: 2px solid transparent;
}
.apphead__link:hover { color: var(--color-text); }
.apphead__link.is-active {
  color: var(--color-text);
  font-weight: var(--font-weight-medium);
  border-bottom-color: var(--color-accent);
}
.apphead__brand--link { text-decoration: none; color: inherit; }
.apphead__sep {
  width: 1px; height: 18px;
  background: var(--color-border);
  display: inline-block;
  margin: 0 var(--space-xs);
}

.main {
  flex: 1 1 auto;
  min-width: 0;
  padding: var(--space-xl) var(--space-2xl);
  background: var(--color-canvas);
}

/* i3b に倣った管理画面のフッター */
.appfoot {
  border-top: var(--border);
  background: var(--color-surface);
  padding: var(--space-lg) var(--space-2xl);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  display: flex;
  justify-content: space-between;
  gap: var(--space-lg);
}
.main__inner { width: 100%; }   /* 画面幅いっぱいに使う（Issue #4） */

.pagehead {
  min-height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-lg);
  margin-bottom: var(--space-lg);
}
.pagehead__title {
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-bold);
  margin: 0;
  letter-spacing: .01em;
  /* D-11 イベント名は100文字まで入る。長い名前でも右のボタンを押しつぶさないよう、
     自身が縮んで2行で省略する（flex item の既定 min-width:auto を打ち消す） */
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
/* ボタン群は縮めない。縮むとボタンの文字が折り返してレイアウトが崩れる */
.pagehead > .stack { flex-shrink: 0; }

/* ---------- 部品 ---------- */
.card {
  background: var(--color-surface);
  border: var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-2xl);
  margin-bottom: var(--space-lg);
}

/* 画像2 の数値タイル */
/* グリッドで列幅を決める。img はフレックス項目だと intrinsic size を下限に持ち
   縮まないため、本文カラムが潰れて1文字ずつ折り返していた（Issue #3） */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 42%);
  padding: 0;
  overflow: hidden;
  height: 260px;
}
.hero__body {
  padding: var(--space-2xl);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: var(--space-sm);
  min-width: 0;
  overflow: hidden;
}
.hero__title {
  font-size: var(--font-size-2xl);
  font-weight: var(--font-weight-bold);
  line-height: 1.4;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero__desc {
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero__image {
  width: 100%;
  height: 100%;
  min-width: 0;
  object-fit: cover;
  background: var(--color-surface-sub);
}
.hero__image--empty { display: flex; align-items: flex-end; justify-content: flex-end; }
.hero__date {
  padding: var(--space-2xl);
  text-align: right;
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-bold);
  line-height: 1.5;
}

.tiles {
  display: flex;
  gap: var(--space-lg);
  flex-wrap: wrap;
  margin-bottom: var(--space-lg);
}
.tile {
  flex: 1 1 200px;
  background: var(--color-surface);
  border: var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
}
.tile__label {
  font-size: var(--font-size-xs);
  letter-spacing: .12em;
  color: var(--color-text-muted);
  text-transform: uppercase;
  margin-bottom: var(--space-sm);
}
.tile__value {
  font-size: var(--font-size-2xl);
  font-weight: var(--font-weight-bold);
  line-height: 1.2;
}
.tile__note { font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-xs); }

/* 一覧行のサムネイル */
.rowthumb {
  width: 56px; height: 36px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--color-surface-sub);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

.btn {
  font-family: inherit;
  font-size: var(--font-size-sm);
  padding: var(--space-sm) var(--space-lg);
  border-radius: var(--radius-sm);
  border: var(--border);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
}
.btn:hover { background: var(--color-surface-sub); }
.btn[disabled] { opacity: .38; cursor: default; }
.btn[disabled]:hover { background: var(--color-surface); }
.btn--primary {
  background: var(--color-accent);
  color: var(--color-accent-text);
  border-color: var(--color-accent);
  font-weight: var(--font-weight-medium);
}
.btn--primary:hover { opacity: .85; background: var(--color-accent); }
.btn--danger { color: var(--color-danger-text); border-color: var(--color-danger-text); }

table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
th, td {
  text-align: left;
  padding: var(--space-md) var(--space-md);
  border-bottom: var(--border);
  vertical-align: middle;
}

/* 行の内容で列幅が動くとボタン位置がずれるため固定する（Issue #4） */
.table--fixed { table-layout: fixed; }
.table--fixed td, .table--fixed th { overflow: hidden; text-overflow: ellipsis; }
.cell-actions { white-space: nowrap; }
.cell-actions .stack { flex-wrap: nowrap; justify-content: flex-end; }
th { color: var(--color-text-muted); font-weight: var(--font-weight-medium); }
tbody tr:hover { background: var(--color-surface-sub); }

.badge {
  display: inline-block;
  font-size: var(--font-size-xs);
  padding: 2px var(--space-sm);
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.badge--success { background: var(--color-success-bg); color: var(--color-success-text); }
.badge--warning { background: var(--color-warning-bg); color: var(--color-warning-text); }
.badge--neutral { background: var(--color-neutral-bg); color: var(--color-neutral-text); }
.badge--danger  { background: var(--color-danger-bg);  color: var(--color-danger-text); }

.muted { color: var(--color-text-muted); }
.empty {
  padding: var(--space-3xl);
  text-align: center;
  color: var(--color-text-muted);
}

.stack { display: flex; gap: var(--space-sm); align-items: center; }

.wip {
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2xl);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

/* ---------- フォーム部品（CLAUDE.md §8 フォームのUI規約） ---------- */
.field { margin-bottom: var(--space-xl); }
.field__label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  margin-bottom: var(--space-xs);
}
.field__req { color: var(--color-danger-text); margin-left: 2px; }
.field__help {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  margin-top: var(--space-xs);
}
.field__error {
  font-size: var(--font-size-xs);
  color: var(--color-danger-text);
  margin-top: var(--space-xs);
}
.field__row { display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; }

input[type=text], input[type=email], input[type=url], input[type=number],
input[type=datetime-local], input[type=password], select, textarea {
  font-family: inherit;
  font-size: var(--font-size-md);
  color: var(--color-text);
  background: var(--color-surface);
  padding: var(--space-sm) var(--space-md);
  border: var(--border);
  border-radius: var(--radius-sm);
  width: 100%;
  max-width: 560px;
}
textarea { min-height: 140px; resize: vertical; line-height: var(--line-height); }
input.is-invalid, select.is-invalid, textarea.is-invalid { border-color: var(--color-danger-text); }
input[type=number] { max-width: 160px; }
input[type=datetime-local] { max-width: 260px; }
.input--sm { max-width: 260px; }

.radio { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--font-size-sm); }
.radio input { margin: 0; }

.section {
  border-top: var(--border);
  padding-top: var(--space-xl);
  margin-top: var(--space-xl);
}
.section__title {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-bold);
  margin: 0 0 var(--space-xs);
}
.section__note { font-size: var(--font-size-xs); color: var(--color-text-muted); margin: 0 0 var(--space-lg); }

.subcard {
  border: var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  background: var(--color-surface);
}
.subcard__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-md);
}
.subcard__title { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }

.steps {
  display: flex;
  gap: var(--space-xs);
  list-style: none;
  margin: 0 0 var(--space-xl);
  padding: 0;
  flex-wrap: wrap;
}
.steps__item {
  font-size: var(--font-size-sm);
  padding: var(--space-sm) var(--space-lg);
  border: var(--border);
  border-radius: var(--radius-full);
  color: var(--color-text-muted);
  cursor: pointer;
  background: var(--color-surface);
}
.steps__item:hover { background: var(--color-surface-sub); }
.steps__item.is-current {
  background: var(--color-accent);
  color: var(--color-accent-text);
  border-color: var(--color-accent);
  font-weight: var(--font-weight-medium);
}
.steps__item.is-done { color: var(--color-text); }

.formbar {
  position: sticky;
  bottom: 0;
  background: var(--color-bg);
  border-top: var(--border);
  padding: var(--space-lg) 0;
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}

.alert {
  border-radius: var(--radius-sm);
  padding: var(--space-md) var(--space-lg);
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-lg);
}
.alert--danger { background: var(--color-danger-bg); color: var(--color-danger-text); }
.alert ul { margin: var(--space-xs) 0 0; padding-left: var(--space-xl); }

.seriesgrid { display: flex; gap: var(--space-2xl); flex-wrap: wrap; }
.seriesblock {
  border: var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  min-width: 220px;
}
.seriesblock__head { margin-bottom: var(--space-md); }
.seriesblock__title { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }

.chartrow { display: flex; gap: var(--space-2xl); align-items: center; flex-wrap: wrap; }
.legend { display: flex; flex-direction: column; gap: var(--space-sm); }
.legend__item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: var(--font-size-sm);
}
.legend__swatch {
  width: 12px; height: 12px;
  border-radius: var(--radius-sm);
  display: inline-block;
  flex: 0 0 12px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-xs);
  align-items: center;
  margin-top: var(--space-sm);
}
.chips__label { font-size: var(--font-size-xs); color: var(--color-text-muted); }
.chip {
  font-family: inherit;
  font-size: var(--font-size-xs);
  padding: 2px var(--space-sm);
  border: var(--border);
  border-radius: var(--radius-full);
  background: var(--color-surface-sub);
  color: var(--color-text);
  cursor: pointer;
}
.chip:hover { background: var(--color-border); }

.toolbar {
  display: flex;
  gap: var(--space-md);
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: var(--space-lg);
}
.toolbar input[type=text], .toolbar select { max-width: 220px; }

.pager {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  justify-content: flex-end;
  margin-top: var(--space-lg);
  font-size: var(--font-size-sm);
}

.modal__mask {
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-3xl) var(--space-lg);
  overflow: auto;
  z-index: 40;
}
.modal {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  width: 100%;
  max-width: 640px;
  padding: var(--space-xl);
}
.modal__title {
  font-size: var(--font-size-lg);

<script>
'use strict';

/* ============================================================
   T1-10 骨組み — ルーティング / ストレージ層 / シードデータ
   画面の中身は T2-1 以降で実装する
   ============================================================ */

/* ------------------------------------------------------------
   定数
   ------------------------------------------------------------ */
var SERVICE_NAME = 'ACTIO';         // サービス名（主催組織名 settings.org.name とは別）
var DB_NAME = 'event-manager-db';   // 仕様書 6.1（一般名を避ける）
var DB_VERSION = 2;                 // v1.16 で files ストアを追加（1→2）
var STORE_EVENTS = 'events';
var STORE_ENTRIES = 'entries';
var STORE_SETTINGS = 'settings';
var STORE_FILES = 'files';          // F-34 運用資料（組織全体）

var MAX_CATEGORIES = 20;            // D-12
var DEFAULT_CATEGORIES = ['セミナー', '勉強会', '研修', '説明会', '懇親会', 'その他'];
var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // D-32（O/0/I/1 を除外）
var CODE_LENGTH = 8;

/* D-40 運用資料（F-34 / S-16） */
var FILE_MIME = [
  'application/pdf', 'image/png', 'image/jpeg',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
];
var FILE_EXT = ['pdf', 'png', 'jpg', 'jpeg', 'xlsx', 'docx'];
var FILE_MAX_BYTES = 5 * 1024 * 1024;
var MAX_FILES = 20;

/* ------------------------------------------------------------
   ストレージ層（IndexedDB）
   仕様書 6章 データモデル
   ------------------------------------------------------------ */
var dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    // ファイルを差し替えても旧データが残るため、スキーマ管理を初期実装から入れる
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_EVENTS)) {
        var ev = db.createObjectStore(STORE_EVENTS, { keyPath: 'id' });
        ev.createIndex('status', 'status', { unique: false });
        ev.createIndex('startAt', 'startAt', { unique: false });
        ev.createIndex('seriesId', 'seriesId', { unique: false });
        ev.createIndex('category', 'category', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_ENTRIES)) {
        var en = db.createObjectStore(STORE_ENTRIES, { keyPath: 'id' });
        en.createIndex('eventId', 'eventId', { unique: false });
        en.createIndex('email', 'email', { unique: false });
        en.createIndex('state', 'state', { unique: false });
        en.createIndex('code', 'code', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
        db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
      }
      // 既存ストアは作り直さず、不足しているものだけを追加する。
      // 旧バージョンから開いた場合もイベント・申込データは保持される
      if (!db.objectStoreNames.contains(STORE_FILES)) {
        var fs = db.createObjectStore(STORE_FILES, { keyPath: 'id' });
        fs.createIndex('createdAt', 'createdAt', { unique: false });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
  return dbPromise;
}

function tx(storeNames, mode, fn) {
  return openDb().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(storeNames, mode);
      var out;
      t.oncomplete = function () { resolve(out); };
      t.onerror = function () { reject(t.error); };
      t.onabort = function () { reject(t.error); };
      out = fn(t);
    });
  });
}

function reqToPromise(req) {
  return new Promise(function (resolve, reject) {
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}

var store = {
  get: function (name, key) { return storeOne(name, 'get', key); },
  put: function (name, value) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).put(value); })
      .then(function () { return value; });
  },
  remove: function (name, key) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).delete(key); });
  },
  clear: function (name) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).clear(); });
  },
  byIndex: function (name, indexName, value) {
    return openDb().then(function (db) {
      return reqToPromise(db.transaction(name, 'readonly').objectStore(name).index(indexName).getAll(value));
    });
  }
};

function storeGetAllRaw(name) {
  return openDb().then(function (db) {
    return reqToPromise(db.transaction(name, 'readonly').objectStore(name).getAll());
  });
}

function storeOne(name, method, key) {
  return openDb().then(function (db) {
    return reqToPromise(db.transaction(name, 'readonly').objectStore(name)[method](key));
  });
}

/* settings は key-value（仕様書 6.4） */
/* 参加者パスワード（F-25）。メールアドレスをキーにした簡易な保管
   組織パスコードと同様、クライアント内の照合であり実セキュリティは持たない */
function getParticipants() {
  return getSetting('participants').then(function (m) { return m || {}; });
}
function setParticipantPassword(email, password) {
  return getParticipants().then(function (m) {
    m[email.toLowerCase()] = password;
    return setSetting('participants', m);
  });
}

function getSetting(key) {
  return store.get(STORE_SETTINGS, key).then(function (row) {
    return row ? row.value : undefined;
  });
}
function setSetting(key, value) {
  return store.put(STORE_SETTINGS, { key: key, value: value });
}

function generateCode() {

  crypto.getRandomValues(buf);
  for (var i = 0; i < CODE_LENGTH; i++) {
    out += CODE_CHARS.charAt(buf[i] % CODE_CHARS.length);

}

/* ---------- 2.1 英数字モードのエンコード ---------- */
function qrEncodeData(text) {
  var bits = [];

    for (var i = length - 1; i >= 0; i--) bits.push((value >>> i) & 1);

  push(0x2, 4);                 // モード指示子 0010
  push(text.length, 9);         // 文字数指示子（バージョン1〜9の英数字モード）

  for (var i = 0; i < text.length; i += 2) {
    var v1 = QR_ALNUM.indexOf(text.charAt(i));
    if (v1 < 0) throw new Error('英数字モードで扱えない文字: ' + text.charAt(i));
    if (i + 1 < text.length) {

      if (v2 < 0) throw new Error('英数字モードで扱えない文字: ' + text.charAt(i + 1));
      push(v1 * 45 + v2, 11);   // 2文字ペアは11ビット
    } else {

  var capacity = QR_DATA_WORDS * 8;

    var byte = 0;
    for (var k = 0; k < 8; k++) byte = (byte << 1) | bits[b + k];
    words.push(byte);

}

/* ---------- 2.2 誤り訂正（Reed-Solomon） ---------- */
function qrErrorCorrection(data) {
  var res = data.slice();
  for (var i = 0; i < QR_EC_WORDS; i++) res.push(0);
  for (var d = 0; d < data.length; d++) {
    var coef = res[d];
    if (coef === 0) continue;
    for (var g = 0; g < QR_GEN_POLY.length; g++) {
      res[d + g] ^= gfMul(QR_GEN_POLY[g], coef);
    }
  }
  return res.slice(data.length);
}

/* ---------- 2.4 機能パターンの配置 ---------- */
function qrNewMatrix() {
  var m = [];
  for (var r = 0; r < QR_SIZE; r++) {
    m.push([]);
    for (var c = 0; c < QR_SIZE; c++) m[r].push(null);
  }
  return m;
}

function qrPlaceFunctionPatterns(m) {
  // 位置検出パターン（7×7）と分離パターン
  [[0, 0], [0, QR_SIZE - 7], [QR_SIZE - 7, 0]].forEach(function (o) {
    var or = o[0], oc = o[1];
    for (var r = -1; r <= 7; r++) {
      for (var c = -1; c <= 7; c++) {
        var rr = or + r, cc = oc + c;
        if (rr < 0 || rr >= QR_SIZE || cc < 0 || cc >= QR_SIZE) continue;
        var inner = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                    (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                    (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        m[rr][cc] = inner;
      }
    }
  });

  // タイミングパターン（6行目・6列目）
  for (var i = 8; i < QR_SIZE - 8; i++) {
    if (m[6][i] === null) m[6][i] = (i % 2 === 0);
    if (m[i][6] === null) m[i][6] = (i % 2 === 0);
  }

  // 固定の黒モジュール
  m[QR_SIZE - 8][8] = true;

  // 形式情報の領域を予約する（値はマスク確定後に書き込む）
  for (var k = 0; k < 15; k++) {
    var pos = qrFormatPositions(k);
    m[pos[0][0]][pos[0][1]] = false;
    m[pos[1][0]][pos[1][1]] = false;
  }
  return m;
}

/* 形式情報の書き込み位置。i は 0（LSB）〜14（MSB） */
function qrFormatPositions(i) {
  var a, b;
  if (i < 6) a = [i, 8];
  else if (i < 8) a = [i + 1, 8];
  else a = [QR_SIZE - 15 + i, 8];

  if (i < 8) b = [8, QR_SIZE - 1 - i];
  else if (i === 8) b = [8, 7];
  else b = [8, 14 - i];
  return [a, b];
}

/* ---------- 2.6 マスク ---------- */
function qrMaskAt(pattern, i, j) {
  switch (pattern) {
    case 0: return (i + j) % 2 === 0;
    case 1: return i % 2 === 0;
    case 2: return j % 3 === 0;
    case 3: return (i + j) % 3 === 0;
    case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
    case 5: return ((i * j) % 2) + ((i * j) % 3) === 0;
    case 6: return (((i * j) % 2) + ((i * j) % 3)) % 2 === 0;
    case 7: return (((i + j) % 2) + ((i * j) % 3)) % 2 === 0;
  }
  return false;
}

/* ---------- 2.5 データ配置（マスクを適用しながら書き込む） ---------- */
function qrPlaceData(m, words, mask) {
  var bitIndex = 7, byteIndex = 0, inc = -1, row = QR_SIZE - 1;
  for (var col = QR_SIZE - 1; col > 0; col -= 2) {
    if (col === 6) col--;                       // 6列目はタイミングパターンなのでスキップ
    while (true) {
      for (var c = 0; c < 2; c++) {
        var cc = col - c;
        if (m[row][cc] !== null) continue;
        var dark = false;
        if (byteIndex < words.length) dark = ((words[byteIndex] >>> bitIndex) & 1) === 1;
        if (qrMaskAt(mask, row, cc)) dark = !dark;
        m[row][cc] = dark;
        bitIndex--;
        if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
      }
      row += inc;
      if (row < 0 || row >= QR_SIZE) { row -= inc; inc = -inc; break; }
    }
  }
  return m;
}

function qrPlaceFormat(m, mask) {
  var bitsStr = QR_FORMAT_L[mask];
  var value = parseInt(bitsStr, 2);
  for (var i = 0; i < 15; i++) {
    var bit = ((value >>> i) & 1) === 1;
    var pos = qrFormatPositions(i);
    m[pos[0][0]][pos[0][1]] = bit;
    m[pos[1][0]][pos[1][1]] = bit;
  }
  m[QR_SIZE - 8][8] = true;      // 固定の黒モジュールは常に黒
  return m;
}

/* ---------- 2.6 ペナルティ評価 ---------- */
function qrPenalty(m) {
  var score = 0, i, j, run, dark = 0;

  // 規則1: 同色5個以上の連続
  for (i = 0; i < QR_SIZE; i++) {
    run = 1;
    for (j = 1; j < QR_SIZE; j++) {
      if (m[i][j] === m[i][j - 1]) { run++; } else { if (run >= 5) score += 3 + (run - 5); run = 1; }
    }
    if (run >= 5) score += 3 + (run - 5);
  }
  for (j = 0; j < QR_SIZE; j++) {
    run = 1;
    for (i = 1; i < QR_SIZE; i++) {
      if (m[i][j] === m[i - 1][j]) { run++; } else { if (run >= 5) score += 3 + (run - 5); run = 1; }
    }
    if (run >= 5) score += 3 + (run - 5);
  }

  // 規則2: 同色の2×2ブロック
  for (i = 0; i < QR_SIZE - 1; i++) {
    for (j = 0; j < QR_SIZE - 1; j++) {
      var v = m[i][j];
      if (v === m[i][j + 1] && v === m[i + 1][j] && v === m[i + 1][j + 1]) score += 3;
    }
  }

  // 規則3: 特定パターン
  var p1 = [true, false, true, true, true, false, true, false, false, false, false];
  var p2 = [false, false, false, false, true, false, true, true, true, false, true];
  function matches(get, start, pat) {
    for (var k = 0; k < pat.length; k++) if (get(start + k) !== pat[k]) return false;
    return true;
  }
  for (i = 0; i < QR_SIZE; i++) {
    for (j = 0; j <= QR_SIZE - 11; j++) {
      var getRow = (function (r) { return function (x) { return m[r][x]; }; })(i);
      if (matches(getRow, j, p1)) score += 40;
      if (matches(getRow, j, p2)) score += 40;
      var getCol = (function (c) { return function (x) { return m[x][c]; }; })(i);
      if (matches(getCol, j, p1)) score += 40;
      if (matches(getCol, j, p2)) score += 40;
    }
  }

  // 規則4: 黒の比率の偏り
  for (i = 0; i < QR_SIZE; i++) for (j = 0; j < QR_SIZE; j++) if (m[i][j]) dark++;
  var ratio = dark * 100 / (QR_SIZE * QR_SIZE);
  score += Math.floor(Math.abs(ratio - 50) / 5) * 10;
  return score;
}

/* ---------- マトリクスの構築（8マスクを試し最小のものを採用） ---------- */
function qrBuildMatrix(text) {
  var data = qrEncodeData(text);
  var words = data.concat(qrErrorCorrection(data));
  var best = null, bestScore = Infinity, bestMask = -1;
  for (var mask = 0; mask < 8; mask++) {
    var m = qrPlaceFunctionPatterns(qrNewMatrix());
    qrPlaceData(m, words, mask);
    qrPlaceFormat(m, mask);          // 形式情報も評価対象に含める
    var score = qrPenalty(m);
    if (score < bestScore) { bestScore = score; best = m; bestMask = mask; }
  }
  return { matrix: best, mask: bestMask, score: bestScore };
}

/* ---------- 2.7 SVG描画 ---------- */
function qrSvg(text) {
  var built = qrBuildMatrix(text);
  var m = built.matrix;
  var total = QR_SIZE + QR_QUIET * 2;
  var svg = svgEl('svg', {
    viewBox: '0 0 ' + total + ' ' + total,
    'shape-rendering': 'crispEdges',
    role: 'img',
    'aria-label': '受付コード ' + text + ' のQRコード'
  });
  svg.appendChild(svgEl('rect', { width: total, height: total, fill: 'var(--color-bg)' }));

  for (var r = 0; r < QR_SIZE; r++) {
    for (var c = 0; c < QR_SIZE; c++) {
      if (!m[r][c]) continue;      // 白は描かず背景で表現する
      svg.appendChild(svgEl('rect', {
        x: c + QR_QUIET, y: r + QR_QUIET, width: 1, height: 1, fill: 'var(--color-text)'
      }));
    }
  }
  return svg;
}

/* 受付コードとQRコードの併記。読み取れない環境の代替としてコード文字列は必ず残す */
function ticketCodeBlock(code) {
  return el('div', { class: 'qrbox' }, [
    qrSvg(code),
    el('div', { class: 'qrbox__code', text: code }),
    el('div', { class: 'qrbox__note', text: '当日の受付でこのコードを提示してください' })
  ]);
}

/* 画像2 の小さな英字ラベル（FEATURED EVENT 等）に相当する見出し */
function eyebrow(text) {
  return el('div', { class: 'eyebrow', text: text });
}

/* DOM 生成は textContent を基本とする（CLAUDE.md §8） */
function el(tag, attrs, children) {
  var node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
    });
  }
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — 日時変換
   日時は ISO 8601 で保持し、表示・入力時に変換する
   ------------------------------------------------------------ */
function toLocalInput(isoStr) {
  if (!isoStr) return '';
  var d = new Date(isoStr);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromLocalInput(value) {
  if (!value) return null;
  var d = new Date(value);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — エラーメッセージ
   文面は 仕様決定シート.md E節の唯一の正。ここで言い換えない
   ------------------------------------------------------------ */
var MSG = {
  required: function (label) { return label + 'を入力してください'; },
  select:   function (label) { return label + 'を選択してください'; },
  maxLength: function (label, n) { return label + 'は' + n + '文字以内で入力してください'; },
  format:   function (label) { return label + 'の形式が正しくありません'; },
  range:    function (label, min, max) { return label + 'は' + min + '以上' + max + '以下で入力してください'; },
  after:    function (label, baseLabel) { return label + 'は' + baseLabel + 'より後の日時を指定してください'; },
  // シート E節に「〜以前」の型が無いため P10 に従い同じ文体で補った（シートへの追加が必要）
  before:   function (label, baseLabel) { return label + 'は' + baseLabel + '以前の日時を指定してください'; },
  capacityShrink: function (n) { return 'すでに' + n + '件の申込があるため、定員を' + n + '未満にはできません'; },
  ticketDelete: '申込のある券種は削除できません',
  noTicket: '公開するには券種を1件以上登録してください',
  categoryInUse: 'このカテゴリを使用しているイベントがあるため削除できません',
  imageTooLarge: '画像は2MB以内のファイルを選択してください',
  fileTooLarge: 'ファイルは5MB以内のものを選択してください',
  fileFormat: '対応していないファイル形式です',
  fileTooMany: '資料は20件以内で登録してください',
  loginFailed: 'メールアドレスまたはパスワードが正しくありません'
};

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — フォーム部品
   規約: 公開時必須には赤い * ／ 直下にヘルプ文 ／ プレースホルダは記入例
   ------------------------------------------------------------ */
function field(opts, control) {
  var errorEl = el('div', { class: 'field__error' });
  var label = el('label', { class: 'field__label' }, [
    document.createTextNode(opts.label),
    opts.required ? el('span', { class: 'field__req', text: '*' }) : null
  ]);
  var node = el('div', { class: 'field' }, [
    label,
    control,
    opts.help ? el('div', { class: 'field__help', text: opts.help }) : null,
    errorEl
  ]);
  node.__error = errorEl;
  node.__control = control;
  return node;
}

function setFieldError(fieldNode, message) {
  if (!fieldNode) return;
  fieldNode.__error.textContent = message || '';
  var c = fieldNode.__control;
  var target = c.tagName === 'DIV' ? null : c;
  if (target) target.classList.toggle('is-invalid', !!message);
}

function textInput(attrs) { return el('input', Object.assign({ type: 'text' }, attrs)); }

/* 検索ボックス（日本語入力対応）
   input のたびに再描画すると、IME の変換確定前に入力欄が作り直されて
   composition が壊れ、子音だけが残る（「ハンズオン」→「ｈあｎｎｚうおｎｎ」）。
   変換中は再描画せず、確定後にまとめて反映する。 */
var SEARCH_DEBOUNCE_MS = 250;

function searchInput(attrs, state, apply) {
  var input = textInput(attrs);
  var composing = false;
  var timer = null;

  function schedule() {
    if (composing) return;                       // 変換中は再描画しない
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      state.caret = input.selectionStart;
      state.focus = true;
      apply(input.value);
    }, SEARCH_DEBOUNCE_MS);
  }

  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () { composing = false; schedule(); });
  input.addEventListener('input', schedule);

  // 再描画後にフォーカスとキャレット位置を復元する
  if (state.focus) {
    setTimeout(function () {
      input.focus();
      var pos = (state.caret === undefined || state.caret === null) ? input.value.length : state.caret;
      try { input.setSelectionRange(pos, pos); } catch (e) { /* 型により未対応 */ }
    }, 0);
  }
  return input;
}

function selectInput(options, value, attrs) {
  var sel = el('select', attrs || {});
  options.forEach(function (o) {
    var v = typeof o === 'string' ? o : o.value;
    var t = typeof o === 'string' ? o : o.label;
    var op = el('option', { value: v, text: t });
    if (v === value) op.selected = true;
    sel.appendChild(op);
  });
  return sel;
}

function radioInput(name, options, value) {
  var wrap = el('div', { class: 'field__row' });
  options.forEach(function (o) {
    var input = el('input', { type: 'radio', name: name, value: o.value });
    if (o.value === value) input.checked = true;
    wrap.appendChild(el('label', { class: 'radio' }, [input, document.createTextNode(o.label)]));
  });
  wrap.value = function () {
    var checked = wrap.querySelector('input:checked');
    return checked ? checked.value : null;
  };
  wrap.setValue = function (v) {
    var target = wrap.querySelector('input[value="' + v + '"]');
    if (target) target.checked = true;
  };
  return wrap;
}

/* モーダル。onSubmit は close を受け取り、検証に失敗したら閉じない */
function openModal(title, children, onSubmit, submitLabel) {
  var mask = el('div', { class: 'modal__mask' });
  function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  var dialog = el('div', { class: 'modal' }, [
    el('h2', { class: 'modal__title', text: title })
  ].concat(children, [
    el('div', { class: 'formbar' }, [
      el('button', { class: 'btn btn--primary', text: submitLabel || '保存',
        onclick: function () { onSubmit(close); } }),
      el('button', { class: 'btn', text: 'やめる', onclick: close })
    ])
  ]));
  mask.appendChild(dialog);
  document.body.appendChild(mask);
  var first = dialog.querySelector('input, textarea, select');
  if (first) first.focus();
  return close;
}

/* T4-2 想定外のエラーの受け皿
   保存・削除が失敗したときに無反応で終わらないよう、必ず画面へ出す。
   IndexedDB の失敗は原因が分かりにくいため、代表的なものは言い換える */
function describeError(err) {
  if (!err) return '原因不明のエラーが発生しました。ページを開き直してください';
  var name = err.name || '';
  if (name === 'QuotaExceededError') {
    return '端末の保存容量が足りません。資料や画像を減らすか、JSONへ書き出してから初期化してください';
  }
  if (name === 'VersionError') {
    return 'データベースのバージョンが合いません。ページを開き直してください';
  }
  if (name === 'InvalidStateError' || name === 'TransactionInactiveError') {
    return 'データベースへの書き込みに失敗しました。ページを開き直してもう一度お試しください';
  }
  return err.message ? ('エラーが発生しました: ' + err.message) : 'エラーが発生しました';
}

function reportError(err) {
  if (window.console && console.error) console.error(err);
  toast(describeError(err), true);
}

function toast(message, isError) {
  var t = el('div', { class: 'toast' + (isError ? ' toast--danger' : ''), text: message });
  document.body.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, isError ? 6000 : 2600);
}

function errorSummary(messages) {
  return el('div', { class: 'alert alert--danger' }, [
    el('div', { text: '入力内容を確認してください（' + messages.length + '件）' }),
    el('ul', {}, messages.map(function (m) { return el('li', { text: m }); }))
  ]);
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — 画像の読み込みとリサイズ（D-15 / D-37 / D-38）
   CLAUDE.md §1 #8 の例外：FileReader で読み込んだ自前の画像なので
   canvas への描画と toBlob() が可能
   ------------------------------------------------------------ */
var IMAGE_MIME = ['image/png', 'image/jpeg', 'image/webp'];
var IMAGE_MAX_BYTES = 2 * 1024 * 1024;

function readAndResizeImage(file, maxEdge) {
  return new Promise(function (resolve, reject) {
    if (IMAGE_MIME.indexOf(file.type) < 0) { reject(new Error(MSG.format('画像'))); return; }
    if (file.size > IMAGE_MAX_BYTES) { reject(new Error(MSG.imageTooLarge)); return; }
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error(MSG.format('画像'))); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error(MSG.format('画像'))); };
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error(MSG.format('画像'))); return; }
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Blob URL の寿命管理
   描画は非同期のため、router() の先頭でまとめて解放すると
   「まだ DOM に載っていない画面ぶんの URL」まで無効化してしまい画像が壊れる。
   実際に画面を差し替える renderShell で、直前の世代だけを解放する */
var pendingObjectUrls = [];   // 今つくっている画面ぶん
var activeObjectUrls = [];    // いま表示している画面ぶん

function blobUrl(blob) {
  var url = URL.createObjectURL(blob);
  pendingObjectUrls.push(url);
  return url;
}

function releasePreviousObjectUrls() {
  activeObjectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
  activeObjectUrls = pendingObjectUrls;
  pendingObjectUrls = [];
}

/* ------------------------------------------------------------
   導出値（仕様書 6.5）— 保持せず都度計算する
   ------------------------------------------------------------ */
function isFinished(event) {                       // F-03 / S-10
  return new Date(event.endAt).getTime() < Date.now();
}

function eventStatusLabel(event) {
  if (isFinished(event)) return { text: '終了', cls: 'badge--neutral' };
  if (event.status === 'published') return { text: '公開中', cls: 'badge--success' };
  return { text: '公開前', cls: 'badge--warning' };
}

/* 申込の状態表示（Issue #5）
   受付が済んで初めて「参加確定」とする。それまでは「申し込み済み」 */
function entryStateLabel(entry) {
  if (entry.state === 'cancelled') return { text: 'キャンセル済み', cls: 'badge--danger' };
  if (entry.checkedInAt) return { text: '参加確定', cls: 'badge--success' };
  return { text: '申し込み済み', cls: 'badge--warning' };
}

function confirmedCount(entries, eventId, ticketTypeId) {
  return entries.filter(function (e) {
    return e.eventId === eventId && e.state === 'confirmed' &&
      (!ticketTypeId || e.ticketTypeId === ticketTypeId);
  }).length;
}

function eventCapacity(event) {
  return (event.ticketTypes || []).reduce(function (sum, t) { return sum + t.capacity; }, 0);
}

/* ------------------------------------------------------------
   初期化 — settings の既定値（仕様書 6.4）
   ------------------------------------------------------------ */
function ensureSettings() {
  var defaults = {
    org: { name: 'NCT', logo: null, headerImage: null },              // F-09 組織ブランディング

/* data URI を Blob に変換する。fetch は file:// で使えないため自前で復号する（制約5） */
function dataUriToBlob(uri) {
  if (!uri) return null;
  var parts = uri.split(',');
  var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  var bin = atob(parts[1]);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

function resetAllData() {
  return Promise.all([
    store.clear(STORE_EVENTS),
    store.clear(STORE_ENTRIES),
    store.clear(STORE_SETTINGS),
    store.clear(STORE_FILES)
  ]).then(ensureSettings).then(function () {
    session.authenticated = false;
    return null;
  });

    salesEnd: opts.salesEnd || null,
    lowStockThreshold: opts.lowStockThreshold === undefined ? 10 : opts.lowStockThreshold // D-25

}

   ログイン状態はメモリ上のみ。ページ再読込で解除される
   ------------------------------------------------------------ */
var session = { authenticated: false, orgName: '', orgLogoUrl: null, settingsTab: 'general', settingsNavOpen: true };

/* ヘッダー表示用に組織情報をメモリへ載せる。ロゴの Blob URL は差し替え時に解放する */
function refreshUiCache() {
  return getSetting('uiState').then(function (ui) {
    if (ui && ui.lastTab) session.settingsTab = ui.lastTab;
  });
}

function refreshOrgCache() {
  return getSetting('org').then(function (org) {
    org = org || {};
    session.orgName = org.name || '';
    if (session.orgLogoUrl) { URL.revokeObjectURL(session.orgLogoUrl); session.orgLogoUrl = null; }
    if (org.logo) session.orgLogoUrl = URL.createObjectURL(org.logo);
    return org;
  });
}

/* ------------------------------------------------------------
   ルーター — location.hash（History API は file:// で不安定なため使わない）
   画面IDと認証要否は 仕様書 5.1 / 5.2 に対応する
   ------------------------------------------------------------ */
var routes = [
  { screen: 'S-01', auth: true,  pattern: /^\/$/,                              render: renderDashboard },
  { screen: 'S-02', auth: true,  pattern: /^\/events$/,                        render: renderEventList },
  { screen: 'S-03', auth: true,  pattern: /^\/events\/new$/,                   render: renderEventEdit },
  { screen: 'S-03', auth: true,  pattern: /^\/events\/([^/]+)\/edit$/,         render: renderEventEdit },
  { screen: 'S-04', auth: true,  pattern: /^\/events\/([^/]+)$/,               render: renderEventDetail },
  { screen: 'S-08', auth: true,  pattern: /^\/events\/([^/]+)\/entries$/,      render: renderEntryList },
  { screen: 'S-16', auth: true,  pattern: /^\/files$/,                          render: renderFiles },
  { screen: 'S-09', auth: true,  pattern: /^\/settings$/,                      render: renderSettings },
  { screen: 'S-12', auth: null,  pattern: /^\/login$/,                         render: renderLogin },
  { screen: 'S-10', auth: false, pattern: /^\/public$/,                        render: renderPublicList },
  { screen: 'S-05', auth: false, pattern: /^\/public\/([^/]+)$/,               render: renderPublicEvent },
  { screen: 'S-05', auth: true,  pattern: /^\/preview\/([^/]+)$/,              render: renderPreviewEvent },
  { screen: 'S-06', auth: false, pattern: /^\/public\/([^/]+)\/apply$/,        render: renderApplyForm },
  { screen: 'S-13', auth: false, pattern: /^\/public\/([^/]+)\/confirm$/,      render: renderApplyConfirm },
  { screen: 'S-07', auth: false, pattern: /^\/public\/([^/]+)\/done$/,         render: renderApplyDone },
  { screen: 'S-11', auth: false, pattern: /^\/lookup$/,                        render: renderLookup },
  { screen: 'S-14', auth: false, pattern: /^\/error$/,                         render: renderError }
];

function currentPath() {
  var h = location.hash.replace(/^#/, '');
  return h === '' ? '/' : h;
}

function navigate(path) { location.hash = path; }

function resolve(path) {
  for (var i = 0; i < routes.length; i++) {
    var m = routes[i].pattern.exec(path);
    if (m) return { route: routes[i], params: m.slice(1) };
  }
  return null;
}

var appEl = null;

function router() {
  var path = currentPath();
  var hit = resolve(path);

  if (!hit) { renderShell('S-14', renderError()); return; }

  // 認証ガード（仕様書 5.2）— 未認証で「要」の画面は S-12 へ
  if (hit.route.auth === true && !session.authenticated) {
    navigate('/login');
    return;
  }

  var out = hit.route.render.apply(null, hit.params);
  Promise.resolve(out).then(function (node) {
    renderShell(hit.route.screen, node);
  }).catch(function (err) {
    if (window.console && console.error) console.error(err);
    renderShell('S-14', renderError(describeError(err)));
  });
}

/* ------------------------------------------------------------
   シェル描画 — 管理側は2カラム、公開側は別レイアウト
   ------------------------------------------------------------ */
/* サイドバーはナビゲーション専用（仕様書 5.3） */
var ADMIN_NAV = [
  { path: '/',         label: 'ダッシュボード',   icon: 'home' },
  { path: '/events',   label: 'イベント',         icon: 'calendar' },
  { path: '/files',    label: '資料',             icon: 'folder' },
  { path: '/settings', label: '設定・データ管理', icon: 'gear' }
];

var ADMIN_SCREENS = ['S-01', 'S-02', 'S-03', 'S-04', 'S-08', 'S-09', 'S-16'];

function renderShell(screenId, contentNode) {
  appEl.textContent = '';
  releasePreviousObjectUrls();   // 直前の画面ぶんだけを解放する
  var isAdmin = session.authenticated && screenId !== 'S-12' &&
    ADMIN_SCREENS.indexOf(screenId) >= 0;

  if (!isAdmin) {
    appEl.appendChild(contentNode);
    return;
  }

  var path = currentPath();
  var nav = el('nav', { class: 'sidebar__nav' });
  ADMIN_NAV.forEach(function (item) {
    var active = item.path === '/' ? path === '/' : path.indexOf(item.path) === 0;
    var link = el('a', {
      class: 'sidebar__link' + (active ? ' sidebar__link--active' : ''),
      href: '#' + item.path
    }, [navIcon(item.icon), el('span', { text: item.label })]);

    // 設定・データ管理は見出しの右の ▼ で子項目を開閉する（Issue #6）
    if (item.path === '/settings') {
      link.appendChild(el('button', {
        class: 'sidebar__caret',
        'aria-expanded': session.settingsNavOpen ? 'true' : 'false',
        'aria-label': session.settingsNavOpen ? '子項目を閉じる' : '子項目を開く',
        text: session.settingsNavOpen ? '▾' : '▸',
        onclick: function (e) {
          e.preventDefault();
          e.stopPropagation();          // 親リンクの遷移を止める
          session.settingsNavOpen = !session.settingsNavOpen;
          router();
        }
      }));
    }
    nav.appendChild(link);

    // 開いていれば、いまどの画面にいても子項目を出して直接移動できる（Issue #6）
    if (item.path === '/settings' && session.settingsNavOpen) {
      nav.appendChild(el('div', { class: 'sidebar__sub' }, SETTINGS_TABS.map(function (t) {
        var current = active && session.settingsTab === t.key;
        return el('a', {
          class: 'sidebar__sublink' + (current ? ' is-active' : ''),
          href: '#/settings',
          text: t.label,
          onclick: function () { selectSettingsTab(t.key); }
        });
      })));
    }
  });

  // 画像2 に倣い、サイドバー下部で運用中の組織を示す
  var orgInitial = (session.orgName || '?').slice(0, 1);
  var sidebar = el('aside', { class: 'sidebar' }, [
    el('a', { class: 'sidebar__brand', href: '#/' }, [actioLogo({})]),
    nav,
    el('div', { class: 'sidebar__foot' }, [
      session.orgLogoUrl
        ? el('img', { class: 'avatar', src: session.orgLogoUrl, alt: '' })
        : el('span', { class: 'avatar avatar--text', text: orgInitial }),
      el('div', { class: 'sidebar__org' }, [
        el('div', { class: 'sidebar__orgname', text: session.orgName || '組織名未設定' }),
        el('div', { class: 'sidebar__orgnote', text: '主催者' })
      ])
    ])
  ]);

  /* ヘッダー: 左＝ロゴ＋組織名 ／ 右＝外部遷移・セッション操作（仕様書 5.3） */
  var headBrand = el('div', { class: 'apphead__brand' }, [
    el('span', { class: 'muted', text: session.orgName || '組織名未設定' })
  ]);
  var header = el('header', { class: 'apphead' }, [
    headBrand,
    el('div', { class: 'apphead__actions' }, [
      el('a', { class: 'apphead__link', href: '#/public', text: '公開ページを見る' }),
      el('a', {
        class: 'apphead__link', href: '#/login', text: 'ログアウト',
        onclick: function () { session.authenticated = false; }
      })
    ])
  ]);

  appEl.appendChild(el('div', { class: 'layout' }, [
    sidebar,
    el('div', { class: 'mainwrap' }, [
      header,
      el('main', { class: 'main' }, [el('div', { class: 'main__inner' }, [contentNode])]),
      el('footer', { class: 'appfoot' }, [
        el('span', { text: '© ' + (session.orgName || '組織名未設定') + '　' + SERVICE_NAME }),
        el('span', { text: 'この端末のブラウザ内にデータを保持しています' })
      ])
    ])
  ]));
}

function pageHead(title, actions) {
  return el('div', { class: 'pagehead' }, [
    el('h1', { class: 'pagehead__title', text: title }),
    el('div', { class: 'stack' }, actions || [])
  ]);
}

/* T2 以降で中身を実装する画面のプレースホルダ */
function wip(taskId, note) {
  return el('div', { class: 'wip' }, [
    el('div', { text: taskId + ' で実装する' }),
    note ? el('div', { class: 'muted', text: note }) : null
  ]);
}

/* ------------------------------------------------------------
   画面 — S-12 主催者ログイン（F-27）
   初回起動時はパスコードの初期設定を兼ねる
   ------------------------------------------------------------ */
function renderLogin() {
  return getSetting('passcode').then(function (passcode) {
    var isFirstRun = !passcode;
    var input = el('input', {
      type: 'password',
      placeholder: isFirstRun ? '4〜16文字の英数字' : 'パスコード',
      autofocus: 'autofocus'
    });
    var error = el('div', { class: 'login__error' });

    function submit() {
      var value = input.value.trim();
      error.textContent = '';
      if (isFirstRun) {
        if (!/^[A-Za-z0-9]{4,16}$/.test(value)) {   // D-33
          error.textContent = 'パスコードは4〜16文字の英数字で入力してください';
          return;
        }
        setSetting('passcode', value).then(function () {
          session.authenticated = true;
          navigate('/');
        });
      } else {
        if (value !== passcode) {
          error.textContent = 'パスコードが正しくありません';
          return;
        }
        session.authenticated = true;
        navigate('/');
      }
    }

    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

    return el('div', { class: 'publicwrap' }, [
      el('header', { class: 'apphead' }, [
        el('a', { class: 'apphead__brand apphead__brand--link', href: '#/public' },
          [actioLogo({ size: 22 })]),
        el('nav', { class: 'apphead__actions' }, [
          el('a', { class: 'apphead__link', href: '#/public', text: 'イベントを探す' }),
          el('a', { class: 'apphead__link', href: '#/lookup', text: 'マイチケット' })
        ])
      ]),
      el('div', { class: 'login' }, [
        el('div', { class: 'card' }, [
          el('h1', { class: 'pagehead__title', text: isFirstRun ? 'パスコードの初期設定' : 'ログイン' }),
          el('p', { class: 'muted', text: isFirstRun
            ? '初回起動です。管理画面に入るためのパスコードを設定してください。'
            : '管理画面に入るにはパスコードを入力してください。' }),
          input,
          error,
          el('button', { class: 'btn btn--primary', text: isFirstRun ? '設定して開始' : 'ログイン', onclick: submit })
        ])
      ])
    ]);
  });
}

/* ------------------------------------------------------------
   画面 — S-01 ダッシュボード（F-18）
   ------------------------------------------------------------ */
function renderDashboard() {
  return Promise.all([storeGetAllRaw(STORE_EVENTS), storeGetAllRaw(STORE_ENTRIES)])
    .then(function (res) {
      var events = res[0], entries = res[1];
      var live = events.filter(function (e) { return e.status === 'published' && !isFinished(e); });
      var drafts = events.filter(function (e) { return e.status === 'draft'; });
      var confirmed = entries.filter(function (e) { return e.state === 'confirmed'; });
      var checkedIn = confirmed.filter(function (e) { return e.checkedInAt; });

      var totalCapacity = live.reduce(function (n, e) { return n + eventCapacity(e); }, 0);
      var liveConfirmed = confirmed.filter(function (e) {
        return live.some(function (ev) { return ev.id === e.eventId; });
      });
      var fillRate = totalCapacity > 0 ? Math.round(liveConfirmed.length / totalCapacity * 100) : 0;
      var checkinRate = confirmed.length > 0 ? Math.round(checkedIn.length / confirmed.length * 100) : 0;

      /* カテゴリ別の開催件数（円グラフ用）。件数の多い順 */
      var byCategory = {};
      events.forEach(function (ev) {
        var key = ev.category || '未分類';
        byCategory[key] = (byCategory[key] || 0) + 1;
      });
      var categorySlices = Object.keys(byCategory).map(function (k) {
        return { label: k, value: byCategory[k] };
      }).sort(function (a, b) { return b.value - a.value; });

      /* 開催予定イベントごとの充足率 */
      var upcoming = live.slice().sort(function (a, b) {
        return new Date(a.startAt) - new Date(b.startAt);
      }).slice(0, 8);
      var upcomingRows = upcoming.map(function (ev) {
        var cap = eventCapacity(ev);
        var got = confirmedCount(entries, ev.id);
        var rate = cap > 0 ? Math.round(got / cap * 100) : 0;
        return el('tr', {}, [
          el('td', {}, [el('a', { href: '#/events/' + ev.id, text: ev.title })]),
          el('td', { text: formatDateTime(ev.startAt) }),
          el('td', { text: got + ' / ' + cap }),
          el('td', {}, [progressBar(rate)])
        ]);
      });

      /* 改善⑤ シリーズ横断集計 */
      var series = {};
      events.forEach(function (ev) {
        if (!ev.seriesId) return;
        if (!series[ev.seriesId]) series[ev.seriesId] = { events: [], confirmed: 0, capacity: 0 };
        series[ev.seriesId].events.push(ev);
        series[ev.seriesId].confirmed += confirmedCount(entries, ev.id);
        series[ev.seriesId].capacity += eventCapacity(ev);
      });
      var seriesKeys = Object.keys(series);
      var seriesBlocks = seriesKeys.map(function (k) {
        var g = series[k];
        g.events.sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
        var bars = g.events.map(function (e, i) {
          return {
            label: '第' + (i + 1) + '回',
            value: confirmedCount(entries, e.id),
            muted: e.status === 'draft'      // 下書きはグレーで示す
          };
        });
        return el('div', { class: 'seriesblock' }, [
          el('div', { class: 'seriesblock__head' }, [
            el('div', { class: 'seriesblock__title', text: g.events[0].title }),
            el('div', { class: 'muted', text: g.events.length + ' 回・累計 ' +
              g.confirmed + ' / ' + g.capacity + ' 名' })
          ]),
          barChart(bars),
          el('div', { class: 'muted', style: 'font-size:var(--font-size-xs)',
            text: '左が第1回。グレーの棒は下書きのイベント。' })
        ]);
      });

      return el('div', {}, [
        pageHead('ダッシュボード', [
          el('a', { class: 'btn btn--primary', href: '#/events/new', text: 'イベントを作成' })
        ]),
        el('div', { class: 'tiles' }, [
          tile('公開中のイベント', live.length + ' 件', '下書き ' + drafts.length + ' 件'),
          tile('申込（参加確定）', confirmed.length + ' 件', 'キャンセルを除く'),
          tile('定員充足率', fillRate + '%', liveConfirmed.length + ' / ' + totalCapacity + ' 名', fillRate),
          tile('チェックイン率', checkinRate + '%', checkedIn.length + ' / ' + confirmed.length + ' 名')
        ]),
        el('div', { class: 'card' }, [
          el('h2', { class: 'section__title', text: 'カテゴリ別の開催状況' }),
          el('p', { class: 'section__note', text: 'どのカテゴリのイベントをどれだけ開いているかの配分です（終了分を含む全イベント）。' }),
          categorySlices.length === 0
            ? el('div', { class: 'empty', text: 'イベントがまだありません。' })
            : el('div', { class: 'chartrow' }, [pieChart(categorySlices), pieLegend(categorySlices)])
        ]),
        el('div', { class: 'card' }, [
          el('h2', { class: 'section__title', text: '開催予定' }),
          upcoming.length === 0
            ? el('div', { class: 'empty', text: '公開中のイベントはありません。' })
            : el('table', {}, [
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: 'イベント名' }), el('th', { text: '開催日時' }),
                  el('th', { text: '申込 / 定員' }), el('th', { text: '充足率' })
                ])]),
                el('tbody', {}, upcomingRows)
              ])
        ]),
        el('div', { class: 'card' }, [
          el('h2', { class: 'section__title', text: 'シリーズ横断の実績' }),
          el('p', { class: 'section__note', text: 'イベントを複製するとシリーズとして束ねられ、回ごとの動員推移を追えます。' }),
          seriesKeys.length === 0
            ? el('div', { class: 'empty', text: 'シリーズに属するイベントはありません。' })
            : el('div', { class: 'seriesgrid' }, seriesBlocks)
        ])
      ]);
    });
}

/* カテゴリ配分の円グラフ（F-18）。SVG を自前で描画する（外部ライブラリ不可） */
/* カテゴリ円グラフの配色。カテゴリ数は可変のためトークン化せず定数で持つ（仕様書 9.2）
   末尾の1色が旧パレットの暖色グレーだったため、ニュートラル系に差し替えた */
var PIE_COLORS = ['#4A7BC8', '#4CAF6D', '#C8944A', '#8A6BC1', '#C05B7A', '#4AA8A8', '#6B7280'];

function pieChart(slices, size) {
  size = size || 180;
  var total = slices.reduce(function (n, s) { return n + s.value; }, 0);
  var svgNs = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNs, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  svg.setAttribute('role', 'img');

  var cx = size / 2, cy = size / 2, r = size / 2 - 2;
  if (total === 0) {
    var empty = document.createElementNS(svgNs, 'circle');
    empty.setAttribute('cx', cx); empty.setAttribute('cy', cy); empty.setAttribute('r', r);
    empty.setAttribute('fill', 'var(--color-surface-sub)');
    svg.appendChild(empty);
    return svg;
  }

  var angle = -Math.PI / 2;   // 12時方向から時計回り
  slices.forEach(function (sl, i) {
    var sweep = (sl.value / total) * Math.PI * 2;
    var color = PIE_COLORS[i % PIE_COLORS.length];
    var node;
    if (slices.length === 1) {
      node = document.createElementNS(svgNs, 'circle');
      node.setAttribute('cx', cx); node.setAttribute('cy', cy); node.setAttribute('r', r);
    } else {
      var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(angle + sweep), y2 = cy + r * Math.sin(angle + sweep);
      var large = sweep > Math.PI ? 1 : 0;
      node = document.createElementNS(svgNs, 'path');
      node.setAttribute('d', 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 +
        ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z');
    }
    node.setAttribute('fill', color);
    var title = document.createElementNS(svgNs, 'title');
    title.textContent = sl.label + ' ' + sl.value + '件（' + Math.round(sl.value / total * 100) + '%）';
    node.appendChild(title);
    svg.appendChild(node);
    angle += sweep;
  });
  return svg;
}

function pieLegend(slices) {
  var total = slices.reduce(function (n, s) { return n + s.value; }, 0);
  return el('div', { class: 'legend' }, slices.map(function (sl, i) {
    return el('div', { class: 'legend__item' }, [
      el('span', { class: 'legend__swatch',
        style: 'background:' + PIE_COLORS[i % PIE_COLORS.length] }),
      el('span', { text: sl.label }),
      el('span', { class: 'muted', text: sl.value + '件・' +
        (total ? Math.round(sl.value / total * 100) : 0) + '%' })
    ]);
  }));
}

/* 縦棒グラフ。左端が第1回（Issue #5）。外部ライブラリは使えないため SVG を自前で描く */
function barChart(bars, opts) {
  opts = opts || {};
  var w = opts.barWidth || 34, gap = opts.gap || 14, h = opts.height || 120;
  var labelH = 22, valueH = 16;
  var max = Math.max(1, bars.reduce(function (n, b) { return Math.max(n, b.value); }, 0));
  var width = bars.length * w + Math.max(0, bars.length - 1) * gap;
  var total = h + labelH + valueH;

  var svg = svgEl('svg', {
    width: width, height: total, viewBox: '0 0 ' + width + ' ' + total,
    role: 'img', 'aria-label': opts.label || '回ごとの申込数'
  });
  // 目盛りの基準線
  svg.appendChild(svgEl('line', {
    x1: 0, y1: valueH + h, x2: width, y2: valueH + h,
    stroke: 'var(--color-border)', 'stroke-width': 1
  }));

  bars.forEach(function (b, i) {
    var x = i * (w + gap);
    var bh = Math.max(2, Math.round(b.value / max * h));
    var y = valueH + h - bh;
    var rect = svgEl('rect', {
      x: x, y: y, width: w, height: bh,
      rx: 3, fill: b.muted ? 'var(--color-border)' : 'var(--color-chart-line)'
    });
    var title = svgEl('title', {});
    title.textContent = b.label + ' ' + b.value + '件';
    rect.appendChild(title);
    svg.appendChild(rect);

    var value = svgEl('text', {
      x: x + w / 2, y: y - 5, 'text-anchor': 'middle',
      'font-size': '11', fill: 'var(--color-text-muted)'
    });
    value.textContent = String(b.value);
    svg.appendChild(value);

    var label = svgEl('text', {
      x: x + w / 2, y: valueH + h + 15, 'text-anchor': 'middle',
      'font-size': '11', fill: 'var(--color-text-muted)'
    });
    label.textContent = b.label;
    svg.appendChild(label);
  });
  return svg;
}

function tile(label, value, note, rate) {
  return el('div', { class: 'tile' }, [
    el('div', { class: 'tile__label', text: label }),
    el('div', { class: 'tile__value', text: value }),
    rate === undefined ? null : el('div', { style: 'margin-top:var(--space-sm)' }, [progressBar(rate)]),
    note ? el('div', { class: 'tile__note', text: note }) : null
  ].filter(Boolean));
}

function progressBar(rate) {
  // 行ホバー（--color-surface-sub）と同色になると見えないため、トラックは --color-border
  var outer = el('div', { style: 'width:160px;height:8px;background:var(--color-border);' +
    'border-radius:var(--radius-full);overflow:hidden;display:inline-block;vertical-align:middle' });

var EVENTS_PER_PAGE = 20;   // F-04 ページング
var eventListState = { q: '', category: '', status: '', page: 1 };

function renderEventList() {
  return Promise.all([
    storeGetAllRaw(STORE_EVENTS), storeGetAllRaw(STORE_ENTRIES), getSetting('categories')
  ]).then(function (res) {
    var events = res[0], entries = res[1], categories = res[2] || [];
    var s = eventListState;

    // 絞り込み（F-04）
    var filtered = events.filter(function (ev) {
      if (s.q && ev.title.toLowerCase().indexOf(s.q.toLowerCase()) < 0) return false;
      if (s.category && ev.category !== s.category) return false;
      if (s.status === 'published') return ev.status === 'published' && !isFinished(ev);
      if (s.status === 'draft') return ev.status === 'draft';
      if (s.status === 'finished') return isFinished(ev);
      return true;
    });

    // D-36 既定の並び順：開始日時の降順
    filtered.sort(function (a, b) { return new Date(b.startAt) - new Date(a.startAt); });

    var totalPages = Math.max(1, Math.ceil(filtered.length / EVENTS_PER_PAGE));
    if (s.page > totalPages) s.page = totalPages;
    var pageItems = filtered.slice((s.page - 1) * EVENTS_PER_PAGE, s.page * EVENTS_PER_PAGE);

    function reload() { router(); }

    var qInput = searchInput({ placeholder: '例: ハンズオン', value: s.q }, s, function (v) {
      s.q = v; s.page = 1; reload();
    });

    var catSelect = selectInput(
      [{ value: '', label: 'すべてのカテゴリ' }].concat(categories.map(function (c) {
        return { value: c, label: c };
      })), s.category);
    catSelect.addEventListener('change', function () { s.category = catSelect.value; s.page = 1; reload(); });

    var statusSelect = selectInput([
      { value: '', label: 'すべての状態' },
      { value: 'published', label: '公開中' },
      { value: 'draft', label: '公開前' },
      { value: 'finished', label: '終了' }
    ], s.status);
    statusSelect.addEventListener('change', function () { s.status = statusSelect.value; s.page = 1; reload(); });

    var body = pageItems.map(function (ev) {
      var st = eventStatusLabel(ev);
      return el('tr', {}, [
        el('td', {}, [ev.coverImage
          ? el('img', { class: 'rowthumb', src: blobUrl(ev.coverImage), alt: '' })
          : el('span', { class: 'rowthumb', text: (ev.category || '—').slice(0, 1) })]),
        el('td', {}, [el('a', { href: '#/events/' + ev.id, text: ev.title })]),
        el('td', {}, [ev.seriesId
          ? el('span', { class: 'badge badge--neutral', text: 'シリーズ' })
          : el('span', { class: 'muted', text: '—' })]),
        el('td', {}, [el('span', { class: 'badge ' + st.cls, text: st.text })]),
        el('td', { text: ev.category }),
        el('td', { text: formatDateTime(ev.startAt) }),
        el('td', { text: confirmedCount(entries, ev.id) + ' / ' + eventCapacity(ev) }),
        el('td', { class: 'cell-actions' }, [
          el('div', { class: 'stack' }, [
            el('button', { class: 'btn', text: '複製', onclick: function () { duplicateEvent(ev); } }),
            el('button', { class: 'btn btn--danger', text: '削除',
              onclick: function () { deleteEvent(ev, entries); } })
          ])
        ])
      ]);
    });

    var pager = el('div', { class: 'pager' }, [
      el('span', { class: 'muted', text: filtered.length + ' 件中 ' +
        (filtered.length === 0 ? 0 : (s.page - 1) * EVENTS_PER_PAGE + 1) + '〜' +
        Math.min(s.page * EVENTS_PER_PAGE, filtered.length) + ' 件' }),
      el('button', { class: 'btn', text: '前へ', disabled: s.page <= 1 ? 'disabled' : null,
        onclick: function () { s.page--; reload(); } }),
      el('span', { text: s.page + ' / ' + totalPages }),
      el('button', { class: 'btn', text: '次へ', disabled: s.page >= totalPages ? 'disabled' : null,
        onclick: function () { s.page++; reload(); } })
    ]);

    return el('div', {}, [
      pageHead('イベント', [
        el('a', { class: 'btn btn--primary', href: '#/events/new', text: 'イベントを作成' })
      ]),
      el('div', { class: 'card' }, [
        el('div', { class: 'toolbar' }, [qInput, catSelect, statusSelect]),
        filtered.length === 0
          ? el('div', { class: 'empty', text: events.length === 0
              ? 'イベントがまだありません。「イベントを作成」から追加してください。'
              : '条件に一致するイベントがありません。' })
          : el('div', {}, [
              el('table', { class: 'table--fixed' }, [
                el('colgroup', {}, [
                  el('col', { style: 'width:80px' }), el('col', {}),
                  el('col', { style: 'width:90px' }), el('col', { style: 'width:100px' }),
                  el('col', { style: 'width:120px' }), el('col', { style: 'width:170px' }),
                  el('col', { style: 'width:120px' }), el('col', { style: 'width:180px' })
                ]),
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: '' }), el('th', { text: 'イベント名' }), el('th', { text: 'シリーズ' }),
                  el('th', { text: '状態' }),

                  el('th', { text: '申込 / 定員' }), el('th', { class: 'cell-actions', text: '操作' })
                ])]),

/* F-05 イベント複製・シリーズ設定
   複製元にシリーズIDが無ければ、複製時に採番して両方へ付与する */
function duplicateEvent(source) {
  var now = Date.now();
  var seriesId = source.seriesId || uid('series');
  var copy = JSON.parse(JSON.stringify({
    title: source.title, description: source.description, format: source.format,
    venue: source.venue, onlineUrl: source.onlineUrl, category: source.category,
    startAt: source.startAt, endAt: source.endAt, deadline: source.deadline,
    ticketTypes: source.ticketTypes, formFields: source.formFields
  }));
  // 券種・フォーム項目のIDは振り直す（申込は引き継がない）
  copy.ticketTypes = (copy.ticketTypes || []).map(function (t) {
    return Object.assign({}, t, { id: uid('tt') });
  });
  copy.formFields = (copy.formFields || []).map(function (f) {
    return Object.assign({}, f, { id: uid('ff') });
  });
  var duplicated = Object.assign(copy, {
    id: uid('ev'),
    title: source.title + '（複製）',
    status: 'draft',                       // 複製は必ず下書きから（D-29）
    seriesId: seriesId,
    coverImage: source.coverImage || null,
    createdAt: iso(now),
    updatedAt: iso(now)
  });

  var chain = source.seriesId
    ? Promise.resolve()
    : store.put(STORE_EVENTS, Object.assign({}, source, { seriesId: seriesId, updatedAt: iso(now) }));

  chain.then(function () { return store.put(STORE_EVENTS, duplicated); })
    .then(function () {
      toast('イベントを複製しました。下書きとして保存しています。');
      navigate('/events/' + duplicated.id + '/edit');
    });
}

/* F-02 イベント削除（D-04 申込があれば件数を示して確認、承諾時は entries も連動削除） */
function deleteEvent(ev, allEntries) {
  var related = allEntries.filter(function (e) { return e.eventId === ev.id; });
  var message = related.length > 0
    ? '「' + ev.title + '」には ' + related.length + ' 件の申込があります。\n' +
      'イベントを削除すると、これらの申込データもすべて削除されます。よろしいですか？'
    : '「' + ev.title + '」を削除します。よろしいですか？';
  if (!confirm(message)) return;

  Promise.all(related.map(function (e) { return store.remove(STORE_ENTRIES, e.id); }))
    .then(function () { return store.remove(STORE_EVENTS, ev.id); })
    .then(function () {
      toast('イベントを削除しました。');
      router();
    });
}

        ])
      ]);
    }

    /* ---------- 基本情報 ---------- */
    fields.title = field(
      { label: 'イベント名', required: true, help: '公開イベントページのタイトルとして表示されます。' },

    );

    fields.category = field(
      { label: 'カテゴリ', required: true, help: '公開イベント一覧の絞り込みに使われます。選択肢は設定・データ管理で編集できます。' },
      selectInput(categories, draft.category, { class: 'input--sm' })
    );

    fields.startAt = field(
      { label: '開始日時', required: true, help: '公開イベントページと一覧カードに表示されます。過去日時も登録できます。' },
      el('input', { type: 'datetime-local', value: toLocalInput(draft.startAt) })
    );
    // D-26 申込締切の初期値は開始日時と同じ。締切が未入力のときだけ補完する

      { label: '終了日時', required: true, help: 'この時刻を過ぎるとイベントは自動で「終了」になり、公開イベント一覧から外れます。' },
      el('input', { type: 'datetime-local', value: toLocalInput(draft.endAt) })
    );

    /* D-15 カバー画像 */
    var coverPreview = el('div');
    var coverError = null;
    function paintCover() {
      coverPreview.textContent = '';
      if (draft.coverImage) {
        coverPreview.appendChild(el('img', { class: 'thumb', src: blobUrl(draft.coverImage), alt: 'カバー画像' }));
        coverPreview.appendChild(el('button', {
          class: 'btn', text: '画像を削除',

        }));
      } else {
        coverPreview.appendChild(el('div', { class: 'muted', text: '未設定' }));
      }
    }
    var coverInput = el('input', { type: 'file', accept: IMAGE_MIME.join(',') });
    coverInput.addEventListener('change', function () {
      var f = coverInput.files && coverInput.files[0];
      if (!f) return;
      setFieldError(coverError, '');
      readAndResizeImage(f, 1200).then(function (blob) {

      }).catch(function (e) {

      }).then(function () { coverInput.value = ''; });
    });
    coverError = field(
      { label: 'カバー画像', help: '公開イベントページのヘッダーと一覧カードに表示されます。推奨1200×400の横長バナー、2MBまで。保存時に長辺1200pxへ縮小されます。' },
      el('div', {}, [coverInput, coverPreview])
    );
    fields.coverImage = coverError;

    /* ---------- 会場・配信 ---------- */

      { label: '会場名・住所', required: true, help: '公開イベントページの「場所」に表示されます。' },
      textInput({ placeholder: '例: 本社 3F セミナールーム（東京都〇〇区…）', maxlength: '200', value: draft.venue })
    );
    var onlineField = field(
      { label: '視聴URL', required: true, help: '公開イベントページに表示されます。参加者への案内メールにも差し込まれます。' },
      el('input', { type: 'url', placeholder: '例: https://example.com/webinar/123', value: draft.onlineUrl })
    );
    fields.venue = venueField;
    fields.onlineUrl = onlineField;

    var formatRadio = radioInput('format', [
      { value: 'venue', label: '会場' }, { value: 'online', label: 'オンライン' }
    ], draft.format);
    function syncFormat() {
      var v = formatRadio.value();
      venueField.style.display = v === 'venue' ? '' : 'none';
      onlineField.style.display = v === 'online' ? '' : 'none';
    }
    formatRadio.addEventListener('change', syncFormat);
    fields.format = field(
      { label: '開催形式', required: true, help: '選んだ形式に応じて、会場名または視聴URLの入力欄が切り替わります。' },
      formatRadio
    );

    /* ---------- 詳細 ---------- */
    fields.description = field(
      { label: '説明文', required: true, help: '公開イベントページの本文として表示されます。改行のみ反映され、装飾はできません。' },
      el('textarea', { placeholder: '例: 新卒メンバー向けに、業務で使うGitの基本操作を90分で学びます。', maxlength: '2000' })
    );
    fields.description.__control.value = draft.description;

    fields.deadline = field(
      { label: '申込締切', required: true, help: 'この時刻を過ぎると公開イベントページから申し込めなくなります。締切時刻ちょうどは受け付けます。' },
      el('input', { type: 'datetime-local', value: toLocalInput(draft.deadline) })
    );

    fields.status = field(
      { label: '公開状態', required: true, help: '「公開」にすると公開イベント一覧に載り、申込を受け付けます。下書きのままなら誰にも見えません。' },
      radioInput('status', [
        { value: 'draft', label: '下書き' }, { value: 'published', label: '公開' }
      ], draft.status)
    );

    /* ---------- 券種（T2-4 / D-21〜D-25） ---------- */
    var ticketHost = el('div');
    function paintTickets() {
      ticketHost.textContent = '';
      draft.ticketTypes.forEach(function (t, i) {
        var sold = confirmedCount(entries, id, t.id);
        var nameF = field({ label: '券種名', required: true, help: '申込フォームの選択肢として表示されます。' },
          textInput({ placeholder: '例: 一般 / 学生 / 社員', maxlength: '50', value: t.name }));
        var capF = field({ label: '定員', required: true,
            help: sold > 0 ? 'この券種にはすでに ' + sold + ' 件の申込があります。' : 'この人数に達すると「満席」になり、申し込めなくなります。' },
          el('input', { type: 'number', min: '1', max: '9999', step: '1', value: String(t.capacity) }));
        var descF = field({ label: '券種の説明', help: '公開イベントページの券種欄に補足として表示されます。' },
          textInput({ placeholder: '例: 社外の方向けの枠です', maxlength: '200', value: t.description || '' }));
        var startF = field({ label: '販売開始', help: '空欄なら公開と同時に申込を受け付けます。' },
          el('input', { type: 'datetime-local', value: toLocalInput(t.salesStart) }));
        var endF = field({ label: '販売終了', help: '空欄なら申込締切まで受け付けます。申込締切より後には設定できません。' },
          el('input', { type: 'datetime-local', value: toLocalInput(t.salesEnd) }));
        var thF = field({ label: '残席表示の閾値', help: '残席がこの数以下のとき「残り○枚」と表示します。0 にすると常に表示しません。' },
          el('input', { type: 'number', min: '0', max: '9999', step: '1', value: String(t.lowStockThreshold) }));

        t.__f = { name: nameF, capacity: capF, description: descF, salesStart: startF, salesEnd: endF, threshold: thF };

        ticketHost.appendChild(el('div', { class: 'subcard' }, [
          el('div', { class: 'subcard__head' }, [
            el('div', { class: 'subcard__title', text: '券種 ' + (i + 1) }),
            el('button', {
              class: 'btn btn--danger', text: '削除',
              onclick: function () {
                if (sold > 0) { alert(MSG.ticketDelete); return; }   // D-03
                if (draft.ticketTypes.length <= 1) { alert(MSG.noTicket); return; }
                readTickets();
                draft.ticketTypes.splice(draft.ticketTypes.indexOf(t), 1);
                paintTickets();
              }
            })
          ]),
          nameF, capF, descF,
          el('div', { class: 'field__row' }, [startF, endF]),
          thF
        ]));
      });
    }
    function readTickets() {
      draft.ticketTypes.forEach(function (t) {
        if (!t.__f) return;
        t.name = t.__f.name.__control.value.trim();
        t.capacity = parseInt(t.__f.capacity.__control.value, 10);
        t.description = t.__f.description.__control.value.trim();
        t.salesStart = fromLocalInput(t.__f.salesStart.__control.value);
        t.salesEnd = fromLocalInput(t.__f.salesEnd.__control.value);
        t.lowStockThreshold = parseInt(t.__f.threshold.__control.value, 10);
      });
