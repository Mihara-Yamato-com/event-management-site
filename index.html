function settingsData() {
  var status = el('div', { class: 'muted' });
  var importError = el('div', { class: 'field__error' });
  var includeFilesCb = el('input', { type: 'checkbox' });   // 既定オフ

  function withBusy(label, fn) {
    status.textContent = label;
    return fn().then(function (r) {
      status.textContent = '完了しました。';
      return refreshOrgCache().then(function () { router(); return r; });
    }).catch(function (e) {
      status.textContent = '';
      importError.textContent = 'エラー: ' + (e && e.message || e);
    });
  }

  var importInput = el('input', { type: 'file', accept: 'application/json,.json' });
  importInput.addEventListener('change', function () {
    var file = importInput.files && importInput.files[0];
    if (!file) return;
    importError.textContent = '';
    if (!confirm('現在のデータをすべて置き換えます。よろしいですか？')) { importInput.value = ''; return; }
    var reader = new FileReader();
    reader.onerror = function () { importError.textContent = 'エラー: ファイルを読み込めませんでした'; };
    reader.onload = function () {
      var payload;
      try { payload = JSON.parse(String(reader.result)); }
      catch (e) { importError.textContent = 'エラー: JSON として読み込めませんでした'; return; }
      withBusy('読み込み中…', function () {
        return importAllData(payload).then(function (r) {
          toast('イベント' + r.events + '件・申込' + r.entries + '件・資料' + r.files + '件を読み込みました。');
          session.authenticated = false;
          navigate('/login');
        });
      });
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  return el('div', {}, [
    el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: 'バックアップ（F-20）' }),
      el('p', { class: 'section__note', text: 'データは端末内にしか存在せず、ブラウザの閲覧データを削除すると全消失します。JSONの書き出しが唯一のバックアップ手段です。定期的に実行してください。' }),
      el('div', { class: 'field' }, [
        el('label', { class: 'radio' }, [includeFilesCb, document.createTextNode('資料ファイル（F-34）を含める')]),
        el('div', { class: 'field__help',
          text: '資料を含めるとJSONが大きくなります（5MB×20件で100MB超）。既定はオフで、資料以外のすべてを書き出します。' })
      ]),
      el('div', { class: 'stack' }, [
        el('button', {
          class: 'btn btn--primary', text: 'JSONを書き出す',
          onclick: function () {
            exportAllData(includeFilesCb.checked).then(function (payload) {
              var d = new Date();
              var p = function (n) { return String(n).padStart(2, '0'); };
              downloadFile('event-manager-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json',
                JSON.stringify(payload, null, 2), 'application/json');
              toast('JSONを書き出しました。');
            });
          }
        })
      ]),
      el('div', { class: 'field' }, [
        el('label', { class: 'field__label', text: 'JSONを読み込む' }),
        importInput,
        el('div', { class: 'field__help', text: '読み込むと現在のデータはすべて置き換わります。読み込み後はログインし直してください。' }),
        importError
      ])
    ]),
    el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: 'デモデータ・初期化（F-21）' }),
      el('p', { class: 'section__note', text: 'デモデータは試験の前提条件を1操作で作るためのものです。投入すると既存データはすべて置き換わります。' }),
      el('div', { class: 'stack' }, [
        el('button', {
          class: 'btn', text: 'デモデータを投入',
          onclick: function () {
            if (!confirm('既存のデータをすべて削除してデモデータを投入します。よろしいですか？')) return;
            withBusy('投入中…', seedDemoData);

        el('button', {

/* ------------------------------------------------------------
   券種の販売可否（F-12 / F-31）
   ------------------------------------------------------------ */
function ticketAvailability(event, ticket, entries) {
  var now = Date.now();
  var sold = confirmedCount(entries, event.id, ticket.id);
  var remaining = Math.max(0, ticket.capacity - sold);
  var reason = null;

  if (isFinished(event)) reason = 'このイベントは終了しました';
  else if (event.deadline && new Date(event.deadline).getTime() < now) reason = '申込受付は終了しました';  // D-06
  else if (ticket.salesStart && new Date(ticket.salesStart).getTime() > now) reason = 'まだ販売開始前です';
  else if (ticket.salesEnd && new Date(ticket.salesEnd).getTime() < now) reason = 'この券種の販売は終了しました';
  else if (remaining <= 0) reason = 'この券種は満席です';

  // F-31 残席は閾値以下のときだけ見せる。0 は常に非表示
  var showRemaining = !reason && ticket.lowStockThreshold > 0 && remaining <= ticket.lowStockThreshold;
  return { sold: sold, remaining: remaining, available: !reason, reason: reason, showRemaining: showRemaining };
}

function publicEventVisible(event) {
  return event.status === 'published' && !isFinished(event);
}

/* ------------------------------------------------------------
   S-10 公開イベント一覧（F-26）— 参加者側の唯一の入口
   ------------------------------------------------------------ */
var publicListState = { q: '', category: '' };

function renderPublicList() {
  return Promise.all([storeGetAllRaw(STORE_EVENTS), getSetting('categories'), getSetting('org')])
    .then(function (res) {
      var events = res[0], categories = res[1] || [], org = res[2] || {};
      var s = publicListState;

      var open = events.filter(publicEventVisible).filter(function (ev) {
        if (s.q && ev.title.toLowerCase().indexOf(s.q.toLowerCase()) < 0) return false;
        if (s.category && ev.category !== s.category) return false;
        return true;
      });
      open.sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });

      var qInput = textInput({ placeholder: '例: ハンズオン', value: s.q });
      qInput.addEventListener('input', function () {
        s.q = qInput.value; s.focus = true; router();
      });
      if (s.focus) {
        setTimeout(function () {
          qInput.focus(); qInput.setSelectionRange(qInput.value.length, qInput.value.length);
        }, 0);
      }
      var catSelect = selectInput(
        [{ value: '', label: 'すべてのカテゴリ' }].concat(categories.map(function (c) {
          return { value: c, label: c };
        })), s.category);
      catSelect.addEventListener('change', function () { s.category = catSelect.value; router(); });

      var cards = open.map(function (ev) {
        return el('div', { class: 'card' }, [
          el('div', {}, [el('a', { href: '#/public/' + ev.id, text: ev.title })]),
          el('div', { class: 'muted', text: formatDateTime(ev.startAt) + '　' +
            (ev.format === 'online' ? 'オンライン' : ev.venue || '会場未定') + '　' + ev.category })
        ]);
      });

      var lead = el('div', { class: 'public__lead' }, [
        el('h2', { class: 'section__title',
          text: (org.name || '当社') + 'が主催するイベントの申込ページです' }),
        el('p', { class: 'muted', style: 'margin:0',
          text: '参加したいイベントを選んでお申し込みください。お申込み後に発行される受付コードとメールアドレスで、'
              + '「マイチケット」から申込内容の確認とキャンセルができます。ログインや会員登録は不要です。' })
      ]);

      return publicShell('開催予定のイベント', [
        lead,
        el('div', { class: 'toolbar' }, [qInput, catSelect])
      ].concat(open.length === 0
        ? [el('div', { class: 'card' }, [el('div', { class: 'empty',
            text: events.filter(publicEventVisible).length === 0
              ? '現在公開中のイベントはありません。'
              : '条件に一致するイベントがありません。' })])]
        : cards), org, true);
    });
}

/* ------------------------------------------------------------
   S-05 公開イベントページ（F-08 / F-10 / F-31）
   ------------------------------------------------------------ */
function renderPublicEvent(eventId) {
  return Promise.all([
    store.get(STORE_EVENTS, eventId),
    store.byIndex(STORE_ENTRIES, 'eventId', eventId),
    getSetting('org')
  ]).then(function (res) {
    var ev = res[0], entries = res[1], org = res[2] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    // D-08 下書きへの直接アクセスは拒否。主催者のプレビューのみ許可
    if (ev.status === 'draft' && !session.authenticated) {
      return renderError('このイベントは公開されていません');
    }

    var finished = isFinished(ev);
    var deadlinePassed = ev.deadline && new Date(ev.deadline).getTime() < Date.now();
    var anyAvailable = (ev.ticketTypes || []).some(function (t) {
      return ticketAvailability(ev, t, entries).available;
    });

    var ticketRows = (ev.ticketTypes || []).map(function (t) {
      var a = ticketAvailability(ev, t, entries);
      var badge = a.available
        ? (a.showRemaining
            ? el('span', { class: 'badge badge--warning', text: '残り' + a.remaining + '枚' })
            : el('span', { class: 'badge badge--success', text: '受付中' }))
        : el('span', { class: 'badge badge--neutral', text: a.reason });
      return el('tr', {}, [
        el('td', {}, [
          el('div', { text: t.name }),
          t.description ? el('div', { class: 'muted', text: t.description }) : null
        ]),
        el('td', {}, [badge])
      ]);
    });

    var notice = null;
    if (ev.status === 'draft') {
      notice = el('div', { class: 'alert alert--danger',
        text: 'これは下書きのプレビューです。参加者にはまだ表示されていません。' });
    } else if (finished) {
      notice = el('div', { class: 'alert alert--danger', text: 'このイベントは終了しました。' });
    } else if (deadlinePassed) {
      notice = el('div', { class: 'alert alert--danger', text: '申込受付は終了しました。' });
    }

    var body = el('div', { class: 'card' }, [
      ev.coverImage ? el('img', { class: 'thumb', src: blobUrl(ev.coverImage), alt: 'カバー画像',
        style: 'max-width:100%;aspect-ratio:3/1;object-fit:cover' }) : null,
      el('p', { text: ev.description }),
      el('table', {}, [el('tbody', {}, [
        statRow('開催日時', formatDateTime(ev.startAt) + ' 〜 ' + formatDateTime(ev.endAt)),
        statRow('開催形式', ev.format === 'online' ? 'オンライン' : '会場'),
        statRow('場所', ev.format === 'online' ? (ev.onlineUrl || '—') : (ev.venue || '—')),
        statRow('申込締切', formatDateTime(ev.deadline)),
        statRow('カテゴリ', ev.category)
      ])]),
      ticketRows.length > 0 ? el('div', { class: 'section' }, [
        el('h2', { class: 'section__title', text: '券種' }),
        el('table', {}, [el('tbody', {}, ticketRows)])
      ]) : null,
      el('div', { class: 'formbar' }, [
        anyAvailable
          ? el('a', { class: 'btn btn--primary', href: '#/public/' + ev.id + '/apply', text: '申し込む' })
          : el('button', { class: 'btn', text: '申し込む', disabled: 'disabled' }),
        el('a', { class: 'btn', href: '#/lookup', text: '申込を確認する' })
      ])
    ]);

    return publicShell(ev.title, [notice, body].filter(Boolean), org);
  });
}

/* ------------------------------------------------------------
   S-06 申込フォーム → S-13 確認 → S-07 完了（F-11 / F-12 / F-24）
   入力途中の値はメモリ上に保持する
   ------------------------------------------------------------ */
var applyDraft = null;   // { eventId, ticketTypeId, name, email, answers }

function renderApplyForm(eventId) {
  return Promise.all([
    store.get(STORE_EVENTS, eventId),
    store.byIndex(STORE_ENTRIES, 'eventId', eventId),
    getSetting('org')
  ]).then(function (res) {
    var ev = res[0], entries = res[1], org = res[2] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    if (ev.status === 'draft' && !session.authenticated) {
      return renderError('このイベントは公開されていません');
    }

    var d = (applyDraft && applyDraft.eventId === eventId)
      ? applyDraft
      : { eventId: eventId, ticketTypeId: null, name: '', email: '', answers: {} };

    var summaryHost = el('div');
    var fields = {};

    // 券種選択（満席・締切済みは選べない）
    var options = [];
    (ev.ticketTypes || []).forEach(function (t) {
      var a = ticketAvailability(ev, t, entries);
      var label = t.name + (a.available
        ? (a.showRemaining ? '（残り' + a.remaining + '枚）' : '')
        : '（' + a.reason + '）');
      if (a.available) options.push({ value: t.id, label: label });
    });

    if (options.length === 0) {
      return publicShell(ev.title + ' — 申込', [
        el('div', { class: 'alert alert--danger', text: '現在申し込める券種がありません。' }),
        el('a', { class: 'btn', href: '#/public/' + ev.id, text: 'イベントページへ戻る' })
      ], org);
    }
    if (!d.ticketTypeId || !options.some(function (o) { return o.value === d.ticketTypeId; })) {
      d.ticketTypeId = options[0].value;
    }

    fields.ticketTypeId = field(
      { label: '券種', required: true, help: '満席・販売終了の券種は選べません。' },
      selectInput(options, d.ticketTypeId, { class: 'input--sm' })
    );
    fields.name = field(
      { label: '氏名', required: true, help: '受付時の照合と、主催者からのご連絡に使います。' },
      textInput({ placeholder: '例: 山田 太郎', maxlength: '50', value: d.name })
    );
    fields.email = field(
      { label: 'メールアドレス', required: true, help: '受付コードのご連絡先です。お間違えのないようご入力ください。' },
      el('input', { type: 'email', placeholder: '例: taro.yamada@example.com', maxlength: '254', value: d.email })
    );

    // カスタム項目（F-07）
    var customHost = el('div');
    var customControls = {};
    (ev.formFields || []).slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (f) {
      var saved = d.answers[f.id];
      var control, node;
      if (f.type === 'textarea') {
        control = el('textarea', { placeholder: '' });
        control.value = saved || '';
      } else if (f.type === 'select') {
        control = selectInput([{ value: '', label: '選択してください' }].concat(
          f.options.map(function (o) { return { value: o, label: o }; })), saved || '', { class: 'input--sm' });
      } else if (f.type === 'radio') {
        control = radioInput('ff_' + f.id, f.options.map(function (o) {
          return { value: o, label: o };
        }), saved || '');
      } else if (f.type === 'checkbox') {
        var cb = el('input', { type: 'checkbox' });
        cb.checked = saved === true || saved === 'true';
        control = el('label', { class: 'radio' }, [cb, document.createTextNode('はい')]);
        control.__cb = cb;
      } else {
        control = textInput({ placeholder: '', maxlength: '200', value: saved || '' });
      }
      node = field({ label: f.label, required: f.required }, control);
      customControls[f.id] = { def: f, node: node, control: control };
      customHost.appendChild(node);
    });

    function collect() {
      var answers = {};
      Object.keys(customControls).forEach(function (id) {
        var c = customControls[id];
        if (c.def.type === 'checkbox') answers[id] = c.control.__cb.checked;
        else if (c.def.type === 'radio') answers[id] = c.control.value();
        else answers[id] = c.control.value.trim ? c.control.value.trim() : c.control.value;
      });
      return {
        eventId: eventId,
        ticketTypeId: fields.ticketTypeId.__control.value,
        name: fields.name.__control.value.trim(),
        email: fields.email.__control.value.trim(),
        answers: answers
      };
    }

    function validate(v) {
      var errors = [];
      [fields.ticketTypeId, fields.name, fields.email].forEach(function (f) { setFieldError(f, ''); });
      Object.keys(customControls).forEach(function (id) { setFieldError(customControls[id].node, ''); });
      function fail(f, m) { setFieldError(f, m); errors.push(m); }

      if (!v.name) fail(fields.name, MSG.required('氏名'));                          // D-30
      else if (v.name.length > 50) fail(fields.name, MSG.maxLength('氏名', 50));
      if (!v.email) fail(fields.email, MSG.required('メールアドレス'));               // D-31
      else if (v.email.length > 254) fail(fields.email, MSG.maxLength('メールアドレス', 254));
      else if (!/^[^\s@]+@[^\s@]+$/.test(v.email)) fail(fields.email, MSG.format('メールアドレス'));

      Object.keys(customControls).forEach(function (id) {
        var c = customControls[id];
        if (!c.def.required) return;
        var val = v.answers[id];
        var empty = c.def.type === 'checkbox' ? val !== true : (!val || String(val).trim() === '');
        if (empty) {
          var msg = ['select', 'radio'].indexOf(c.def.type) >= 0
            ? MSG.select(c.def.label) : MSG.required(c.def.label);
          fail(c.node, msg);
        }
      });

      // F-12 重複申込（eventId + email、cancelled は対象外）D-09
      if (v.email && entries.some(function (e) {
        return e.state === 'confirmed' && e.email.toLowerCase() === v.email.toLowerCase();
      })) {
        fail(fields.email, 'このメールアドレスはすでに申し込まれています');
      }

      // 選択中の券種がまだ受け付けているか
      var ticket = (ev.ticketTypes || []).filter(function (t) { return t.id === v.ticketTypeId; })[0];
      if (!ticket) fail(fields.ticketTypeId, MSG.select('券種'));
      else {
        var a = ticketAvailability(ev, ticket, entries);
        if (!a.available) fail(fields.ticketTypeId, a.reason);
      }
      return errors;
    }

    return publicShell(ev.title + ' — 申込', [
      summaryHost,
      el('div', { class: 'card' }, [
        el('p', { class: 'muted', text: '「*」の付いた項目は必須です。' }),
        fields.ticketTypeId, fields.name, fields.email,
        customHost,
        el('div', { class: 'formbar' }, [
          el('button', {
            class: 'btn btn--primary', text: '確認画面へ',
            onclick: function () {
              var v = collect();
              var errors = validate(v);
              summaryHost.textContent = '';
              if (errors.length > 0) {
                summaryHost.appendChild(errorSummary(errors));
                summaryHost.scrollIntoView({ block: 'nearest' });
                return;
              }
              applyDraft = v;
              navigate('/public/' + eventId + '/confirm');
            }
          }),
          el('a', { class: 'btn', href: '#/public/' + eventId, text: 'やめる' })
        ])
      ])
    ], org);
  });
}

function renderApplyConfirm(eventId) {
  if (!applyDraft || applyDraft.eventId !== eventId) {
    navigate('/public/' + eventId + '/apply');
    return el('div');
  }
  return Promise.all([
    store.get(STORE_EVENTS, eventId),
    store.byIndex(STORE_ENTRIES, 'eventId', eventId),
    getSetting('org')
  ]).then(function (res) {
    var ev = res[0], entries = res[1], org = res[2] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    var d = applyDraft;
    var ticket = (ev.ticketTypes || []).filter(function (t) { return t.id === d.ticketTypeId; })[0];
    var errorHost = el('div');

    var rows = [
      statRow('イベント', ev.title),
      statRow('開催日時', formatDateTime(ev.startAt)),
      statRow('券種', ticket ? ticket.name : '—'),
      statRow('氏名', d.name),
      statRow('メールアドレス', d.email)
    ];
    (ev.formFields || []).slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (f) {
      var v = d.answers[f.id];
      var text = f.type === 'checkbox' ? (v ? 'はい' : 'いいえ') : (v || '—');
      rows.push(statRow(f.label, text));
    });

    function submit() {
      errorHost.textContent = '';
      // 確定直前にもう一度チェックする（この間に満席・締切になっている可能性がある）
      return store.byIndex(STORE_ENTRIES, 'eventId', eventId).then(function (latest) {
        var t = (ev.ticketTypes || []).filter(function (x) { return x.id === d.ticketTypeId; })[0];
        if (!t) { errorHost.appendChild(el('div', { class: 'alert alert--danger', text: MSG.select('券種') })); return; }
        var a = ticketAvailability(ev, t, latest);
        if (!a.available) {
          errorHost.appendChild(el('div', { class: 'alert alert--danger', text: a.reason }));
          return;
        }
        if (latest.some(function (e) {
          return e.state === 'confirmed' && e.email.toLowerCase() === d.email.toLowerCase();
        })) {
          errorHost.appendChild(el('div', { class: 'alert alert--danger',
            text: 'このメールアドレスはすでに申し込まれています' }));
          return;
        }
        // D-32 受付コードはイベント内で一意
        var used = {};
        latest.forEach(function (e) { used[e.code] = true; });
        var code = generateCode();
        var guard = 0;
        while (used[code] && guard++ < 50) code = generateCode();

        var now = iso(Date.now());
        var entry = {
          id: uid('en'), eventId: eventId, ticketTypeId: d.ticketTypeId, code: code,
          name: d.name, email: d.email, answers: d.answers,
          state: 'confirmed', checkedInAt: null, cancelledAt: null,
          createdAt: now, updatedAt: now
        };
        return store.put(STORE_ENTRIES, entry).then(function () {
          applyDraft = null;
          lastApplied = { eventId: eventId, code: code };
          navigate('/public/' + eventId + '/done');
        });
      });
    }

    return publicShell('申込内容の確認', [
      errorHost,
      el('div', { class: 'card' }, [
        el('p', { class: 'muted', text: '内容をご確認のうえ「この内容で申し込む」を押してください。' }),
        el('table', {}, [el('tbody', {}, rows)]),
        el('div', { class: 'formbar' }, [
          el('button', { class: 'btn btn--primary', text: 'この内容で申し込む', onclick: submit }),
          el('a', { class: 'btn', href: '#/public/' + eventId + '/apply', text: '入力内容を修正する' })
        ])
      ])
    ], org);
  });
}

var lastApplied = null;

function renderApplyDone(eventId) {
  if (!lastApplied || lastApplied.eventId !== eventId) {
    navigate('/public/' + eventId);
    return el('div');
  }
  var code = lastApplied.code;
  return Promise.all([store.get(STORE_EVENTS, eventId), getSetting('org')]).then(function (res) {
    var ev = res[0], org = res[1] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    return publicShell('申込が完了しました', [
      el('div', { class: 'card' }, [
        el('p', { text: ev.title + ' へのお申込みを受け付けました。' }),
        el('div', { class: 'alert', style: 'background:var(--color-success-bg);color:var(--color-success-text)' }, [
          el('div', { text: '受付コード' }),
          el('div', { style: 'font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);letter-spacing:2px', text: code })
        ]),
        el('div', { class: 'field__help' }, [
          el('div', { text: '受付コードは次の3つに使います。' }),
          el('ul', {}, [
            el('li', { text: '当日の受付（会場でこのコードをお伝えください）' }),
            el('li', { text: 'マイチケットでの申込内容の確認' }),
            el('li', { text: 'お申込みのキャンセル' })
          ]),
          el('div', { text: '確認メールは自動送信されません。このコードを必ず控えてください。' })
        ]),
        el('table', {}, [el('tbody', {}, [
          statRow('開催日時', formatDateTime(ev.startAt) + ' 〜 ' + formatDateTime(ev.endAt)),
          statRow('場所', ev.format === 'online' ? (ev.onlineUrl || '—') : (ev.venue || '—'))
        ])]),
        el('div', { class: 'formbar' }, [
          el('a', { class: 'btn btn--primary', href: '#/lookup', text: 'マイチケットで確認する' }),
          el('a', { class: 'btn', href: '#/public', text: 'イベントを探す' })
        ])
      ])
    ], org);
  });
}

/* ------------------------------------------------------------
   S-11 申込照会／電子チケット（F-25 / F-24 / F-13）
   受付コード＋メールアドレスの照合で本人確認を代替する
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   S-11 マイチケット（F-25 / F-24 / F-13）
   受付コード＋メールアドレスで照合し、同一メールの申込を全件表示する。
   メールアドレスのみでの一覧表示は行わない（他人の申込を閲覧できてしまうため）
   ------------------------------------------------------------ */
var lookupSession = null;   // { email }（メモリ上のみ。再読込で解除）

function renderLookup() {
  return getSetting('org').then(function (org) {
    org = org || {};
    var host = el('div');

    function showForm(message) {
      host.textContent = '';
      var codeF = field({ label: '受付コード', required: true, help: '申込完了画面に表示された8桁の英数字です。' },
        textInput({ placeholder: '例: H7K2M9XQ', maxlength: '8' }));
      var mailF = field({ label: 'メールアドレス', required: true, help: 'お申込み時に入力したメールアドレスです。' },
        el('input', { type: 'email', placeholder: '例: taro.yamada@example.com' }));
      var errorHost = el('div');
      if (message) errorHost.appendChild(el('div', { class: 'alert alert--danger', text: message }));

      function search() {
        errorHost.textContent = '';
        setFieldError(codeF, ''); setFieldError(mailF, '');
        var code = codeF.__control.value.trim().toUpperCase();
        var email = mailF.__control.value.trim();
        if (!code) { setFieldError(codeF, MSG.required('受付コード')); return; }
        if (!email) { setFieldError(mailF, MSG.required('メールアドレス')); return; }

        store.byIndex(STORE_ENTRIES, 'code', code).then(function (hits) {
          var match = hits.filter(function (e) {
            return e.email.toLowerCase() === email.toLowerCase();
          })[0];
          if (!match) {
            errorHost.appendChild(el('div', { class: 'alert alert--danger',
              text: '受付コードとメールアドレスの組み合わせが見つかりません。入力内容をご確認ください。' }));
            return;
          }
          lookupSession = { email: match.email };
          showList();
        });
      }

      codeF.__control.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
      mailF.__control.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });

      host.appendChild(el('div', { class: 'card' }, [
        el('p', { class: 'muted', text: '受付コードとメールアドレスで照合すると、そのメールアドレスの申込をまとめて確認できます。' }),
        codeF, mailF, errorHost,
        el('div', { class: 'formbar' }, [
          el('button', { class: 'btn btn--primary', text: '照会する', onclick: search })
        ])
      ]));
    }

    function showList() {
      host.textContent = '';
      var email = lookupSession.email;
      store.byIndex(STORE_ENTRIES, 'email', email).then(function (mine) {
        return Promise.all(mine.map(function (en) {
          return store.get(STORE_EVENTS, en.eventId).then(function (ev) {
            return { entry: en, event: ev };
          });
        }));
      }).then(function (rows) {
        // 開催が近い順。終了済みは末尾へ
        rows.sort(function (a, b) {
          var fa = a.event ? isFinished(a.event) : true;
          var fb = b.event ? isFinished(b.event) : true;
          if (fa !== fb) return fa ? 1 : -1;
          var ta = a.event ? new Date(a.event.startAt) : 0;
          var tb = b.event ? new Date(b.event.startAt) : 0;
          return ta - tb;
        });

        host.appendChild(el('div', { class: 'card' }, [
          el('div', { class: 'stack' }, [
            el('span', { text: email + ' の申込 ' + rows.length + ' 件' }),
            el('button', {
              class: 'btn', text: '別のコードで照会',
              onclick: function () { lookupSession = null; showForm(); }
            })
          ])
        ]));

        if (rows.length === 0) {
          host.appendChild(el('div', { class: 'card' }, [
            el('div', { class: 'empty', text: 'お申込みはありません。' })
          ]));
          return;
        }
        rows.forEach(function (r) {
          host.appendChild(ticketCard(r.entry, r.event, showList));
        });
      });
    }

    if (lookupSession) showList(); else showForm();

    return publicShell('マイチケット', [host], org);
  });
}

function ticketCard(entry, ev, refresh) {
  var ticket = ev ? (ev.ticketTypes || []).filter(function (t) { return t.id === entry.ticketTypeId; })[0] : null;
  var finished = ev ? isFinished(ev) : true;

  var badge;
  if (entry.state === 'cancelled') badge = el('span', { class: 'badge badge--danger', text: 'キャンセル済み' });
  else if (finished) badge = el('span', { class: 'badge badge--neutral', text: '終了' });
  else badge = el('span', { class: 'badge badge--success', text: '参加確定' });

  var actions = [];
  var note = null;
  if (entry.state === 'confirmed') {
    if (finished) {
      // 終了済みイベントは履歴として表示するのみ（キャンセル操作は不可）
      note = '終了したイベントのため、この画面からの操作はできません。';
    } else if (entry.checkedInAt) {
      note = '受付済みのためこの画面からはキャンセルできません。主催者へご連絡ください。';  // D-10
    } else {
      actions.push(el('button', {
        class: 'btn btn--danger', text: 'キャンセルする',
        onclick: function () {
          if (!confirm('「' + (ev ? ev.title : '') + '」のお申込みをキャンセルします。よろしいですか？')) return;
          var now = iso(Date.now());
          store.put(STORE_ENTRIES, Object.assign({}, entry, {
            state: 'cancelled', cancelledAt: now, updatedAt: now
          })).then(function () { toast('キャンセルしました。'); refresh(); });
        }
      }));
    }
  }
  if (ev && entry.state === 'confirmed' && !finished) {
    actions.push(el('a', { class: 'btn', href: '#/public/' + ev.id, text: 'イベントページ' }));
  }

  return el('div', { class: 'card' }, [
    el('div', { class: 'stack' }, [
      el('h2', { class: 'section__title', text: ev ? ev.title : '（削除されたイベント）' }),
      badge
    ]),
    el('table', {}, [el('tbody', {}, [
      statRow('受付コード', entry.code),
      statRow('券種', ticket ? ticket.name : '—'),
      ev ? statRow('開催日時', formatDateTime(ev.startAt) + ' 〜 ' + formatDateTime(ev.endAt)) : null,
      ev ? statRow('場所', ev.format === 'online' ? (ev.onlineUrl || '—') : (ev.venue || '—')) : null,
      statRow('氏名', entry.name),
      statRow('受付', entry.checkedInAt ? formatDateTime(entry.checkedInAt) + ' に受付済み' : '未受付')
    ].filter(Boolean))]),
    note ? el('p', { class: 'muted', text: note }) : null,
    actions.length > 0 ? el('div', { class: 'formbar' }, actions) : null
  ].filter(Boolean));
}

/* ------------------------------------------------------------
   S-16 資料（F-34 運用資料の管理）
   イベント単位ではなく組織全体の資料置き場
   ------------------------------------------------------------ */
function fileExtOf(name) {
  var m = /\.([A-Za-z0-9]+)$/.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function renderFiles() {
  return storeGetAllRaw(STORE_FILES).then(function (files) {
    files.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

    var noteF = field({ label: '説明', help: '何の資料かがわかるように書いておくと、あとから探しやすくなります。' },
      textInput({ placeholder: '例: 第1回の進行台本（最終版）', maxlength: '200' }));
    var input = el('input', { type: 'file', accept: '.pdf,.png,.jpg,.jpeg,.xlsx,.docx' });
    var fileF = field({ label: '資料ファイル', required: true,
      help: 'pdf / png / jpeg / xlsx / docx、1ファイル5MBまで、' + MAX_FILES + '件まで。画像も縮小せず原本のまま保存します。' }, input);

    function add() {
      setFieldError(fileF, '');
      var f = input.files && input.files[0];
      if (!f) { setFieldError(fileF, MSG.required('資料ファイル')); return; }
      if (files.length >= MAX_FILES) { setFieldError(fileF, MSG.fileTooMany); return; }   // D-40
      var ext = fileExtOf(f.name);
      if (FILE_EXT.indexOf(ext) < 0 && FILE_MIME.indexOf(f.type) < 0) {
        setFieldError(fileF, MSG.fileFormat); return;
      }
      if (f.size > FILE_MAX_BYTES) { setFieldError(fileF, MSG.fileTooLarge); return; }
      store.put(STORE_FILES, {
        id: uid('file'),
        name: f.name.slice(0, 100),
        note: noteF.__control.value.trim(),
        mime: f.type || '',
        size: f.size,
        blob: f,                       // リサイズせず原本を保持する
        createdAt: iso(Date.now())
      }).then(function () { toast('資料を登録しました。'); router(); });
    }

    var rows = files.map(function (f) {
      return el('tr', {}, [
        el('td', { text: f.name }),
        el('td', { text: f.note || '—' }),
        el('td', { text: formatBytes(f.size) }),
        el('td', { text: formatDateTime(f.createdAt) }),
        el('td', {}, [el('div', { class: 'stack' }, [
          el('button', { class: 'btn', text: 'ダウンロード',
            onclick: function () { downloadFile(f.name, f.blob); } }),
          el('button', { class: 'btn btn--danger', text: '削除',
            onclick: function () {
              if (!confirm('「' + f.name + '」を削除します。よろしいですか？')) return;
              store.remove(STORE_FILES, f.id).then(function () { toast('資料を削除しました。'); router(); });
            } })
        ])])
      ]);
    });

    return el('div', {}, [
      pageHead('資料'),
      el('div', { class: 'card' }, [
        el('p', { class: 'muted', text: '進行台本・会場図・配布資料など、イベント運営に使う資料の置き場です。イベント単位ではなく組織全体で共有します。' }),
        el('div', { class: 'alert', style: 'background:var(--color-warning-bg);color:var(--color-warning-text)',
          text: 'ファイルはこの端末のブラウザ内にのみ保存されます。他のメンバーとは共有されません。受け渡しにはJSONの書き出し（設定・データ管理）を使ってください。' }),
        files.length === 0
          ? el('div', { class: 'empty', text: '資料はまだ登録されていません。' })
          : el('table', {}, [
              el('thead', {}, [el('tr', {}, [
                el('th', { text: 'ファイル名' }), el('th', { text: '説明' }),
                el('th', { text: 'サイズ' }), el('th', { text: '登録日時' }), el('th', { text: '' })
              ])]),
              el('tbody', {}, rows)
            ]),
        el('div', { class: 'pager' }, [
          el('span', { class: 'muted', text: files.length + ' / ' + MAX_FILES + ' 件' })
        ])
      ]),
      el('div', { class: 'card' }, [
        el('h2', { class: 'section__title', text: '資料を登録' }),
        fileF, noteF,
        el('div', { class: 'formbar' }, [
          el('button', { class: 'btn btn--primary', text: '登録', onclick: add })
        ])
      ])
    ]);
  });
}

/* S-14 エラー */
function renderError(message) {
  return publicShell('ページが見つかりません', [
    el('div', { class: 'card' }, [
      el('p', { text: message || '指定されたページは存在しません。' }),
      el('a', { class: 'btn', href: '#/public', text: '公開イベント一覧へ' })
    ])
  ]);
}

/* ------------------------------------------------------------
   起動
   ------------------------------------------------------------ */
function boot() {
  appEl = document.getElementById('app');
  window.addEventListener('hashchange', router);
  ensureSettings()
    .then(refreshOrgCache)
    .then(function () { router(); })
    .catch(function (err) {
      console.error(err);
      appEl.textContent = 'データベースを開けませんでした: ' + (err && err.message || err);
    });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
