<meta charset="utf-8">
<title>イベント主催・管理サービス</title>

<style>
/* ============================================================
   デザイントークン — 仕様書.md 9章「デザイントークン」が唯一の正
   値をここで独自に変えないこと
   ============================================================ */
:root {
  /* 基本 */
  --color-bg:            #F7F6F3;
  --color-surface:       #FFFFFF;
  --color-surface-sub:   #F0EFEB;
  --color-border:        #E4E2DC;
  --color-text:          #1A1A18;
  --color-text-muted:    #8A8880;

  /* アクセント */
  --color-accent:        #1A1A18;
  --color-accent-text:   #FFFFFF;

  /* セマンティック */
  --color-success-bg:    #E4F1E5;  --color-success-text: #2E7D40;
  --color-warning-bg:    #FBF1DA;  --color-warning-text: #96792A;
  --color-neutral-bg:    #ECEAE6;  --color-neutral-text: #6B6963;
  --color-danger-bg:     #FBE6E3;  --color-danger-text:  #B23B2C;

  /* 可視化 */
  --color-progress:      #4CAF6D;
  --color-chart-line:    #4A7BC8;
  --color-chart-grid:    #EDEBE7;

  /* 余白 */
  --space-xs: 4px;   --space-sm: 8px;   --space-md: 12px;
  --space-lg: 16px;  --space-xl: 24px;  --space-2xl: 32px; --space-3xl: 48px;

  /* 角丸 */
  --radius-sm: 4px;  --radius-md: 6px;  --radius-full: 9999px;

  /* タイポグラフィ */
  --font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-size-xs: 12px;  --font-size-sm: 13px;  --font-size-md: 14px;
  --font-size-lg: 16px;  --font-size-xl: 20px;  --font-size-2xl: 28px;
  --font-size-display: 40px;
  --font-weight-normal: 400; --font-weight-medium: 500; --font-weight-bold: 700;
  --line-height: 1.7;

  /* 境界・影 */
  --border:    1px solid var(--color-border);
  --shadow-sm: 0 1px 2px rgba(26,26,24,.06);
  --shadow-md: 0 4px 12px rgba(26,26,24,.10);

  /* レイアウト */
  --sidebar-width: 200px;
  --content-max-width: 1200px;
  --header-height: 56px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-family);

a { color: inherit; }

}
.sidebar__link:hover { background: var(--color-border); }

.badge {

  padding: var(--space-2xl);

  font-size: var(--font-size-sm);
}

/* ---------- フォーム部品（CLAUDE.md §8 フォームのUI規約） ---------- */
.field { margin-bottom: var(--space-xl); }
.field__label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  margin-bottom: var(--space-xs);
}

  color: var(--color-text-muted);
  margin-top: var(--space-xs);

  font-size: var(--font-size-xs);
  color: var(--color-danger-text);
  margin-top: var(--space-xs);
}
.field__row { display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; }

input[type=text], input[type=email], input[type=url], input[type=number],
input[type=datetime-local], input[type=password], select, textarea {
  font-family: inherit;
  font-size: var(--font-size-md);
  color: var(--color-text);
  background: var(--color-surface);
  padding: var(--space-sm) var(--space-md);
  border: var(--border);
  border-radius: var(--radius-sm);

}

.pager {
  display: flex;
  gap: var(--space-sm);

.modal {

.toast {

/* ---------- 公開側（管理画面と別レイアウト） ---------- */
.public { max-width: 960px; margin: 0 auto; padding: var(--space-2xl) var(--space-xl); }
.public__head {
  border-bottom: var(--border);
  padding-bottom: var(--space-lg);
  margin-bottom: var(--space-xl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-lg);

.public__nav { display: flex; gap: var(--space-lg); }
.public__nav a {

  color: var(--color-text-muted);
  text-decoration: none;
  padding-bottom: 2px;
}
.public__nav a:hover { color: var(--color-text); }
.public__nav a.is-active {

.public__brand { font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); text-decoration: none; }

  border-radius: var(--radius-md);

/* ---------- ログイン ---------- */
.login { max-width: 360px; margin: 15vh auto; }
.login input {
  width: 100%;
  font-family: inherit;
  font-size: var(--font-size-md);
  padding: var(--space-sm) var(--space-md);
  border: var(--border);
  border-radius: var(--radius-sm);

.login__error { color: var(--color-danger-text); font-size: var(--font-size-sm); }

<div id="app"></div>

<script>
'use strict';

/* ============================================================
   T1-10 骨組み — ルーティング / ストレージ層 / シードデータ
   画面の中身は T2-1 以降で実装する
   ============================================================ */

/* ------------------------------------------------------------
   定数
   ------------------------------------------------------------ */
var DB_NAME = 'event-manager-db';   // 仕様書 6.1（一般名を避ける）
var DB_VERSION = 2;                 // v1.16 で files ストアを追加（1→2）
var STORE_EVENTS = 'events';
var STORE_ENTRIES = 'entries';
var STORE_SETTINGS = 'settings';
var STORE_FILES = 'files';          // F-34 運用資料（組織全体）

var MAX_CATEGORIES = 20;            // D-12
var DEFAULT_CATEGORIES = ['セミナー', '勉強会', '研修', '説明会', '懇親会', 'その他'];
var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // D-32（O/0/I/1 を除外）
var CODE_LENGTH = 8;

/* D-40 運用資料（F-34 / S-16） */
var FILE_MIME = [
  'application/pdf', 'image/png', 'image/jpeg',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
];
var FILE_EXT = ['pdf', 'png', 'jpg', 'jpeg', 'xlsx', 'docx'];
var FILE_MAX_BYTES = 5 * 1024 * 1024;
var MAX_FILES = 20;

/* ------------------------------------------------------------
   ストレージ層（IndexedDB）
   仕様書 6章 データモデル
   ------------------------------------------------------------ */
var dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    // ファイルを差し替えても旧データが残るため、スキーマ管理を初期実装から入れる
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_EVENTS)) {
        var ev = db.createObjectStore(STORE_EVENTS, { keyPath: 'id' });
        ev.createIndex('status', 'status', { unique: false });
        ev.createIndex('startAt', 'startAt', { unique: false });
        ev.createIndex('seriesId', 'seriesId', { unique: false });
        ev.createIndex('category', 'category', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_ENTRIES)) {
        var en = db.createObjectStore(STORE_ENTRIES, { keyPath: 'id' });
        en.createIndex('eventId', 'eventId', { unique: false });
        en.createIndex('email', 'email', { unique: false });
        en.createIndex('state', 'state', { unique: false });
        en.createIndex('code', 'code', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
        db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
      }
      // 既存ストアは作り直さず、不足しているものだけを追加する。
      // 旧バージョンから開いた場合もイベント・申込データは保持される
      if (!db.objectStoreNames.contains(STORE_FILES)) {
        var fs = db.createObjectStore(STORE_FILES, { keyPath: 'id' });
        fs.createIndex('createdAt', 'createdAt', { unique: false });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
  return dbPromise;
}

function tx(storeNames, mode, fn) {
  return openDb().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(storeNames, mode);
      var out;
      t.oncomplete = function () { resolve(out); };
      t.onerror = function () { reject(t.error); };
      t.onabort = function () { reject(t.error); };
      out = fn(t);
    });
  });
}

function reqToPromise(req) {
  return new Promise(function (resolve, reject) {
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}

var store = {
  get: function (name, key) { return storeOne(name, 'get', key); },
  put: function (name, value) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).put(value); })
      .then(function () { return value; });
  },
  remove: function (name, key) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).delete(key); });
  },
  clear: function (name) {
    return tx(name, 'readwrite', function (t) { t.objectStore(name).clear(); });
  },
  byIndex: function (name, indexName, value) {
    return openDb().then(function (db) {
      return reqToPromise(db.transaction(name, 'readonly').objectStore(name).index(indexName).getAll(value));
    });
  }
};

function storeGetAllRaw(name) {
  return openDb().then(function (db) {
    return reqToPromise(db.transaction(name, 'readonly').objectStore(name).getAll());
  });
}

function storeOne(name, method, key) {
  return openDb().then(function (db) {
    return reqToPromise(db.transaction(name, 'readonly').objectStore(name)[method](key));
  });
}

/* settings は key-value（仕様書 6.4） */
function getSetting(key) {
  return store.get(STORE_SETTINGS, key).then(function (row) {
    return row ? row.value : undefined;
  });
}
function setSetting(key, value) {
  return store.put(STORE_SETTINGS, { key: key, value: value });
}

/* ------------------------------------------------------------
   汎用ユーティリティ
   ------------------------------------------------------------ */
function uid(prefix) {
  return prefix + '-' + Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2, 8);
}

/* D-32 受付コード：英大文字＋数字8桁。紛らわしい文字を除外 */
function generateCode() {
  var out = '';
  var buf = new Uint32Array(CODE_LENGTH);
  crypto.getRandomValues(buf);
  for (var i = 0; i < CODE_LENGTH; i++) {
    out += CODE_CHARS.charAt(buf[i] % CODE_CHARS.length);
  }
  return out;
}

function iso(d) { return new Date(d).toISOString(); }

function formatDateTime(isoStr) {
  if (!isoStr) return '—';
  var d = new Date(isoStr);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* DOM 生成は textContent を基本とする（CLAUDE.md §8） */
function el(tag, attrs, children) {
  var node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
    });
  }
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — 日時変換
   日時は ISO 8601 で保持し、表示・入力時に変換する
   ------------------------------------------------------------ */
function toLocalInput(isoStr) {
  if (!isoStr) return '';
  var d = new Date(isoStr);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromLocalInput(value) {
  if (!value) return null;
  var d = new Date(value);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — エラーメッセージ
   文面は 仕様決定シート.md E節の唯一の正。ここで言い換えない
   ------------------------------------------------------------ */
var MSG = {
  required: function (label) { return label + 'を入力してください'; },
  select:   function (label) { return label + 'を選択してください'; },
  maxLength: function (label, n) { return label + 'は' + n + '文字以内で入力してください'; },
  format:   function (label) { return label + 'の形式が正しくありません'; },
  range:    function (label, min, max) { return label + 'は' + min + '以上' + max + '以下で入力してください'; },
  after:    function (label, baseLabel) { return label + 'は' + baseLabel + 'より後の日時を指定してください'; },

   規約: 公開時必須には赤い * ／ 直下にヘルプ文 ／ プレースホルダは記入例

function field(opts, control) {
  var errorEl = el('div', { class: 'field__error' });
  var label = el('label', { class: 'field__label' }, [
    document.createTextNode(opts.label),
    opts.required ? el('span', { class: 'field__req', text: '*' }) : null
  ]);
  var node = el('div', { class: 'field' }, [
    label,
    control,
    opts.help ? el('div', { class: 'field__help', text: opts.help }) : null,
    errorEl
  ]);
  node.__error = errorEl;
  node.__control = control;
  return node;
}

function setFieldError(fieldNode, message) {
  if (!fieldNode) return;
  fieldNode.__error.textContent = message || '';
  var c = fieldNode.__control;
  var target = c.tagName === 'DIV' ? null : c;
  if (target) target.classList.toggle('is-invalid', !!message);
}

function textInput(attrs) { return el('input', Object.assign({ type: 'text' }, attrs)); }

function selectInput(options, value, attrs) {
  var sel = el('select', attrs || {});
  options.forEach(function (o) {
    var v = typeof o === 'string' ? o : o.value;
    var t = typeof o === 'string' ? o : o.label;
    var op = el('option', { value: v, text: t });
    if (v === value) op.selected = true;
    sel.appendChild(op);
  });
  return sel;
}

function radioInput(name, options, value) {
  var wrap = el('div', { class: 'field__row' });
  options.forEach(function (o) {
    var input = el('input', { type: 'radio', name: name, value: o.value });
    if (o.value === value) input.checked = true;
    wrap.appendChild(el('label', { class: 'radio' }, [input, document.createTextNode(o.label)]));
  });
  wrap.value = function () {
    var checked = wrap.querySelector('input:checked');
    return checked ? checked.value : null;
  };
  wrap.setValue = function (v) {
    var target = wrap.querySelector('input[value="' + v + '"]');
    if (target) target.checked = true;
  };
  return wrap;
}

/* モーダル。onSubmit は close を受け取り、検証に失敗したら閉じない */
function openModal(title, children, onSubmit, submitLabel) {
  var mask = el('div', { class: 'modal__mask' });
  function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  var dialog = el('div', { class: 'modal' }, [
    el('h2', { class: 'modal__title', text: title })
  ].concat(children, [
    el('div', { class: 'formbar' }, [
      el('button', { class: 'btn btn--primary', text: submitLabel || '保存',
        onclick: function () { onSubmit(close); } }),
      el('button', { class: 'btn', text: 'やめる', onclick: close })
    ])
  ]));
  mask.appendChild(dialog);
  document.body.appendChild(mask);
  var first = dialog.querySelector('input, textarea, select');
  if (first) first.focus();
  return close;
}

function toast(message) {
  var t = el('div', { class: 'toast', text: message });
  document.body.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
}

function errorSummary(messages) {
  return el('div', { class: 'alert alert--danger' }, [
    el('div', { text: '入力内容を確認してください（' + messages.length + '件）' }),
    el('ul', {}, messages.map(function (m) { return el('li', { text: m }); }))
  ]);
}

/* ------------------------------------------------------------
   T2-1 共通UI基盤 — 画像の読み込みとリサイズ（D-15 / D-37 / D-38）
   CLAUDE.md §1 #8 の例外：FileReader で読み込んだ自前の画像なので
   canvas への描画と toBlob() が可能
   ------------------------------------------------------------ */
var IMAGE_MIME = ['image/png', 'image/jpeg', 'image/webp'];
var IMAGE_MAX_BYTES = 2 * 1024 * 1024;

function readAndResizeImage(file, maxEdge) {
  return new Promise(function (resolve, reject) {
    if (IMAGE_MIME.indexOf(file.type) < 0) { reject(new Error(MSG.format('画像'))); return; }
    if (file.size > IMAGE_MAX_BYTES) { reject(new Error(MSG.imageTooLarge)); return; }
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error(MSG.format('画像'))); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error(MSG.format('画像'))); };
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error(MSG.format('画像'))); return; }
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

var objectUrls = [];
function blobUrl(blob) {
  var url = URL.createObjectURL(blob);
  objectUrls.push(url);
  return url;
}
function revokeObjectUrls() {
  objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
  objectUrls = [];
}

/* ------------------------------------------------------------
   ルーター — location.hash（History API は file:// で不安定なため使わない）
   画面IDと認証要否は 仕様書 5.1 / 5.2 に対応する
   ------------------------------------------------------------ */
var routes = [
  { screen: 'S-01', auth: true,  pattern: /^\/$/,                              render: renderDashboard },
  { screen: 'S-02', auth: true,  pattern: /^\/events$/,                        render: renderEventList },
  { screen: 'S-03', auth: true,  pattern: /^\/events\/new$/,                   render: renderEventEdit },
  { screen: 'S-03', auth: true,  pattern: /^\/events\/([^/]+)\/edit$/,         render: renderEventEdit },
  { screen: 'S-04', auth: true,  pattern: /^\/events\/([^/]+)$/,               render: renderEventDetail },
  { screen: 'S-08', auth: true,  pattern: /^\/events\/([^/]+)\/entries$/,      render: renderEntryList },
  { screen: 'S-16', auth: true,  pattern: /^\/files$/,                          render: renderFiles },
  { screen: 'S-09', auth: true,  pattern: /^\/settings$/,                      render: renderSettings },
  { screen: 'S-12', auth: null,  pattern: /^\/login$/,                         render: renderLogin },
  { screen: 'S-10', auth: false, pattern: /^\/public$/,                        render: renderPublicList },
  { screen: 'S-05', auth: false, pattern: /^\/public\/([^/]+)$/,               render: renderPublicEvent },
  { screen: 'S-06', auth: false, pattern: /^\/public\/([^/]+)\/apply$/,        render: renderApplyForm },
  { screen: 'S-13', auth: false, pattern: /^\/public\/([^/]+)\/confirm$/,      render: renderApplyConfirm },
  { screen: 'S-07', auth: false, pattern: /^\/public\/([^/]+)\/done$/,         render: renderApplyDone },
  { screen: 'S-11', auth: false, pattern: /^\/lookup$/,                        render: renderLookup },
  { screen: 'S-14', auth: false, pattern: /^\/error$/,                         render: renderError }
];

function currentPath() {
  var h = location.hash.replace(/^#/, '');
  return h === '' ? '/' : h;
}

function navigate(path) { location.hash = path; }

function resolve(path) {
  for (var i = 0; i < routes.length; i++) {
    var m = routes[i].pattern.exec(path);
    if (m) return { route: routes[i], params: m.slice(1) };
  }
  return null;
}

var appEl = null;

function router() {
  revokeObjectUrls();   // 前の画面で作った Blob URL を解放してから描画する
  var path = currentPath();
  var hit = resolve(path);

  if (!hit) { renderShell('S-14', renderError()); return; }

  // 認証ガード（仕様書 5.2）— 未認証で「要」の画面は S-12 へ
  if (hit.route.auth === true && !session.authenticated) {
    navigate('/login');
    return;
  }

  var out = hit.route.render.apply(null, hit.params);
  Promise.resolve(out).then(function (node) {
    renderShell(hit.route.screen, node);
  }).catch(function (err) {
    console.error(err);
    renderShell('S-14', renderError(String(err && err.message || err)));
  });
}

/* ------------------------------------------------------------
   画面 — S-12 主催者ログイン（F-27）
   初回起動時はパスコードの初期設定を兼ねる
   ------------------------------------------------------------ */
function renderLogin() {
  return getSetting('passcode').then(function (passcode) {
    var isFirstRun = !passcode;
    var input = el('input', {
      type: 'password',
      placeholder: isFirstRun ? '4〜16文字の英数字' : 'パスコード',
      autofocus: 'autofocus'
    });
    var error = el('div', { class: 'login__error' });

    function submit() {
      var value = input.value.trim();
      error.textContent = '';
      if (isFirstRun) {
        if (!/^[A-Za-z0-9]{4,16}$/.test(value)) {   // D-33
          error.textContent = 'パスコードは4〜16文字の英数字で入力してください';
          return;
        }
        setSetting('passcode', value).then(function () {
          session.authenticated = true;
          navigate('/');
        });
      } else {
        if (value !== passcode) {
          error.textContent = 'パスコードが正しくありません';
          return;
        }
        session.authenticated = true;
        navigate('/');
      }
    }

    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

/* ------------------------------------------------------------
   画面 — S-01 ダッシュボード（F-18）
   ------------------------------------------------------------ */
function renderDashboard() {
  return Promise.all([storeGetAllRaw(STORE_EVENTS), storeGetAllRaw(STORE_ENTRIES)])
    .then(function (res) {
      var events = res[0], entries = res[1];
      var live = events.filter(function (e) { return e.status === 'published' && !isFinished(e); });
      var drafts = events.filter(function (e) { return e.status === 'draft'; });
      var confirmed = entries.filter(function (e) { return e.state === 'confirmed'; });
      var checkedIn = confirmed.filter(function (e) { return e.checkedInAt; });

      var totalCapacity = live.reduce(function (n, e) { return n + eventCapacity(e); }, 0);
      var liveConfirmed = confirmed.filter(function (e) {
        return live.some(function (ev) { return ev.id === e.eventId; });
      });
      var fillRate = totalCapacity > 0 ? Math.round(liveConfirmed.length / totalCapacity * 100) : 0;
      var checkinRate = confirmed.length > 0 ? Math.round(checkedIn.length / confirmed.length * 100) : 0;

      /* 開催予定イベントごとの充足率 */
      var upcoming = live.slice().sort(function (a, b) {
        return new Date(a.startAt) - new Date(b.startAt);
      }).slice(0, 8);
      var upcomingRows = upcoming.map(function (ev) {
        var cap = eventCapacity(ev);
        var got = confirmedCount(entries, ev.id);
        var rate = cap > 0 ? Math.round(got / cap * 100) : 0;
        return el('tr', {}, [
          el('td', {}, [el('a', { href: '#/events/' + ev.id, text: ev.title })]),
          el('td', { text: formatDateTime(ev.startAt) }),
          el('td', { text: got + ' / ' + cap }),
          el('td', {}, [progressBar(rate)])
        ]);
      });

      /* 改善⑤ シリーズ横断集計 */
      var series = {};
      events.forEach(function (ev) {
        if (!ev.seriesId) return;
        if (!series[ev.seriesId]) series[ev.seriesId] = { events: [], confirmed: 0, capacity: 0 };
        series[ev.seriesId].events.push(ev);
        series[ev.seriesId].confirmed += confirmedCount(entries, ev.id);
        series[ev.seriesId].capacity += eventCapacity(ev);
      });
      var seriesKeys = Object.keys(series);
      var seriesRows = seriesKeys.map(function (k) {
        var g = series[k];
        g.events.sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
        return el('tr', {}, [
          el('td', { text: g.events[0].title }),
          el('td', { text: g.events.length + ' 回' }),
          el('td', { text: g.confirmed + ' / ' + g.capacity }),
          el('td', { text: g.events.map(function (e) { return confirmedCount(entries, e.id); }).join(' → ') })
        ]);
      });

      return el('div', {}, [
        pageHead('ダッシュボード', [
          el('a', { class: 'btn btn--primary', href: '#/events/new', text: 'イベントを作成' })
        ]),
        el('div', { class: 'card' }, [
          el('table', {}, [el('tbody', {}, [
            statRow('公開中のイベント', live.length + ' 件（下書き ' + drafts.length + ' 件）'),
            statRow('申込（参加確定）', confirmed.length + ' 件'),
            el('tr', {}, [
              el('th', { text: '定員充足率（公開中）' }),
              el('td', {}, [el('div', { class: 'stack' }, [
                el('span', { text: liveConfirmed.length + ' / ' + totalCapacity + '　' + fillRate + '%' }),
                progressBar(fillRate)
              ])])
            ]),
            statRow('チェックイン率', checkedIn.length + ' / ' + confirmed.length + '　' + checkinRate + '%')
          ])])
        ]),
        el('div', { class: 'card' }, [
          el('h2', { class: 'section__title', text: '開催予定' }),
          upcoming.length === 0
            ? el('div', { class: 'empty', text: '公開中のイベントはありません。' })
            : el('table', {}, [
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: 'イベント名' }), el('th', { text: '開催日時' }),
                  el('th', { text: '申込 / 定員' }), el('th', { text: '充足率' })
                ])]),
                el('tbody', {}, upcomingRows)
              ])
        ]),
        el('div', { class: 'card' }, [
          el('h2', { class: 'section__title', text: 'シリーズ横断の実績（改善⑤）' }),
          el('p', { class: 'section__note', text: 'イベントを複製するとシリーズとして束ねられ、回ごとの動員推移を追えます。' }),
          seriesKeys.length === 0
            ? el('div', { class: 'empty', text: 'シリーズに属するイベントはありません。' })
            : el('table', {}, [
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: 'シリーズ' }), el('th', { text: '開催回数' }),
                  el('th', { text: '累計 申込 / 定員' }), el('th', { text: '回ごとの申込' })
                ])]),
                el('tbody', {}, seriesRows)
              ])
        ])
      ]);
    });
}

function progressBar(rate) {
  var outer = el('div', { style: 'width:160px;height:8px;background:var(--color-surface-sub);' +
    'border-radius:var(--radius-full);overflow:hidden;display:inline-block;vertical-align:middle' });
  outer.appendChild(el('div', { style: 'width:' + Math.min(100, rate) + '%;height:100%;' +
    'background:var(--color-progress)' }));
  return outer;
}

function statRow(label, value) {
  return el('tr', {}, [el('th', { text: label }), el('td', { text: value })]);
}

/* ------------------------------------------------------------
   画面 — S-02 イベント一覧（F-04）
   ------------------------------------------------------------ */
var EVENTS_PER_PAGE = 20;   // F-04 ページング
var eventListState = { q: '', category: '', status: '', page: 1 };

function renderEventList() {
  return Promise.all([
    storeGetAllRaw(STORE_EVENTS), storeGetAllRaw(STORE_ENTRIES), getSetting('categories')
  ]).then(function (res) {
    var events = res[0], entries = res[1], categories = res[2] || [];
    var s = eventListState;

    // 絞り込み（F-04）
    var filtered = events.filter(function (ev) {
      if (s.q && ev.title.toLowerCase().indexOf(s.q.toLowerCase()) < 0) return false;
      if (s.category && ev.category !== s.category) return false;
      if (s.status === 'published') return ev.status === 'published' && !isFinished(ev);
      if (s.status === 'draft') return ev.status === 'draft';
      if (s.status === 'finished') return isFinished(ev);
      return true;
    });

    // D-36 既定の並び順：開始日時の降順
    filtered.sort(function (a, b) { return new Date(b.startAt) - new Date(a.startAt); });

    var totalPages = Math.max(1, Math.ceil(filtered.length / EVENTS_PER_PAGE));
    if (s.page > totalPages) s.page = totalPages;
    var pageItems = filtered.slice((s.page - 1) * EVENTS_PER_PAGE, s.page * EVENTS_PER_PAGE);

    function reload() { router(); }

    var qInput = textInput({ placeholder: '例: ハンズオン', value: s.q });
    qInput.addEventListener('input', function () {
      s.q = qInput.value; s.page = 1; s.focusSearch = true; reload();
    });
    if (s.focusSearch) {
      setTimeout(function () {
        qInput.focus();
        qInput.setSelectionRange(qInput.value.length, qInput.value.length);
      }, 0);
    }

    var catSelect = selectInput(
      [{ value: '', label: 'すべてのカテゴリ' }].concat(categories.map(function (c) {
        return { value: c, label: c };
      })), s.category);
    catSelect.addEventListener('change', function () { s.category = catSelect.value; s.page = 1; reload(); });

    var statusSelect = selectInput([
      { value: '', label: 'すべての状態' },
      { value: 'published', label: '公開中' },
      { value: 'draft', label: '公開前' },
      { value: 'finished', label: '終了' }
    ], s.status);
    statusSelect.addEventListener('change', function () { s.status = statusSelect.value; s.page = 1; reload(); });

    var body = pageItems.map(function (ev) {
      var st = eventStatusLabel(ev);
      return el('tr', {}, [
        el('td', {}, [
          el('a', { href: '#/events/' + ev.id, text: ev.title }),
          ev.seriesId ? el('span', { class: 'badge badge--neutral', text: 'シリーズ' }) : null
        ]),
        el('td', {}, [el('span', { class: 'badge ' + st.cls, text: st.text })]),
        el('td', { text: ev.category }),
        el('td', { text: formatDateTime(ev.startAt) }),
        el('td', { text: confirmedCount(entries, ev.id) + ' / ' + eventCapacity(ev) }),
        el('td', {}, [
          el('div', { class: 'stack' }, [
            el('button', { class: 'btn', text: '複製', onclick: function () { duplicateEvent(ev); } }),
            el('button', { class: 'btn btn--danger', text: '削除',
              onclick: function () { deleteEvent(ev, entries); } })
          ])
        ])
      ]);
    });

    var pager = el('div', { class: 'pager' }, [
      el('span', { class: 'muted', text: filtered.length + ' 件中 ' +
        (filtered.length === 0 ? 0 : (s.page - 1) * EVENTS_PER_PAGE + 1) + '〜' +
        Math.min(s.page * EVENTS_PER_PAGE, filtered.length) + ' 件' }),
      el('button', { class: 'btn', text: '前へ', disabled: s.page <= 1 ? 'disabled' : null,
        onclick: function () { s.page--; reload(); } }),
      el('span', { text: s.page + ' / ' + totalPages }),
      el('button', { class: 'btn', text: '次へ', disabled: s.page >= totalPages ? 'disabled' : null,
        onclick: function () { s.page++; reload(); } })
    ]);

    return el('div', {}, [
      pageHead('イベント', [
        el('a', { class: 'btn btn--primary', href: '#/events/new', text: 'イベントを作成' })
      ]),
      el('div', { class: 'card' }, [
        el('div', { class: 'toolbar' }, [qInput, catSelect, statusSelect]),
        filtered.length === 0
          ? el('div', { class: 'empty', text: events.length === 0
              ? 'イベントがまだありません。「イベントを作成」から追加してください。'
              : '条件に一致するイベントがありません。' })
          : el('div', {}, [
              el('table', {}, [
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: 'イベント名' }), el('th', { text: '状態' }),
                  el('th', { text: 'カテゴリ' }), el('th', { text: '開催日時' }),
                  el('th', { text: '申込 / 定員' }), el('th', { text: '' })
                ])]),
                el('tbody', {}, body)
              ]),
              pager
            ])
      ])
    ]);
  });
}

/* F-05 イベント複製・シリーズ設定
   複製元にシリーズIDが無ければ、複製時に採番して両方へ付与する */
function duplicateEvent(source) {
  var now = Date.now();
  var seriesId = source.seriesId || uid('series');
  var copy = JSON.parse(JSON.stringify({
    title: source.title, description: source.description, format: source.format,
    venue: source.venue, onlineUrl: source.onlineUrl, category: source.category,
    startAt: source.startAt, endAt: source.endAt, deadline: source.deadline,
    ticketTypes: source.ticketTypes, formFields: source.formFields
  }));
  // 券種・フォーム項目のIDは振り直す（申込は引き継がない）
  copy.ticketTypes = (copy.ticketTypes || []).map(function (t) {
    return Object.assign({}, t, { id: uid('tt') });
  });
  copy.formFields = (copy.formFields || []).map(function (f) {
    return Object.assign({}, f, { id: uid('ff') });
  });
  var duplicated = Object.assign(copy, {
    id: uid('ev'),
    title: source.title + '（複製）',
    status: 'draft',                       // 複製は必ず下書きから（D-29）
    seriesId: seriesId,
    coverImage: source.coverImage || null,
    createdAt: iso(now),
    updatedAt: iso(now)
  });

  var chain = source.seriesId
    ? Promise.resolve()
    : store.put(STORE_EVENTS, Object.assign({}, source, { seriesId: seriesId, updatedAt: iso(now) }));

  chain.then(function () { return store.put(STORE_EVENTS, duplicated); })
    .then(function () {
      toast('イベントを複製しました。下書きとして保存しています。');
      navigate('/events/' + duplicated.id + '/edit');
    });
}

/* F-02 イベント削除（D-04 申込があれば件数を示して確認、承諾時は entries も連動削除） */
function deleteEvent(ev, allEntries) {
  var related = allEntries.filter(function (e) { return e.eventId === ev.id; });
  var message = related.length > 0
    ? '「' + ev.title + '」には ' + related.length + ' 件の申込があります。\n' +
      'イベントを削除すると、これらの申込データもすべて削除されます。よろしいですか？'
    : '「' + ev.title + '」を削除します。よろしいですか？';
  if (!confirm(message)) return;

  Promise.all(related.map(function (e) { return store.remove(STORE_ENTRIES, e.id); }))
    .then(function () { return store.remove(STORE_EVENTS, ev.id); })
    .then(function () {
      toast('イベントを削除しました。');
      router();
    });
}

        var startF = field({ label: '販売開始', help: '空欄なら公開と同時に申込を受け付けます。' },
          el('input', { type: 'datetime-local', value: toLocalInput(t.salesStart) }));
        var endF = field({ label: '販売終了', help: '空欄なら申込締切まで受け付けます。申込締切より後には設定できません。' },
          el('input', { type: 'datetime-local', value: toLocalInput(t.salesEnd) }));
        var thF = field({ label: '残席表示の閾値', help: '残席がこの数以下のとき「残り○枚」と表示します。0 にすると常に表示しません。' },
          el('input', { type: 'number', min: '0', max: '9999', step: '1', value: String(t.lowStockThreshold) }));

        t.__f = { name: nameF, capacity: capF, description: descF, salesStart: startF, salesEnd: endF, threshold: thF };

        ticketHost.appendChild(el('div', { class: 'subcard' }, [
          el('div', { class: 'subcard__head' }, [
            el('div', { class: 'subcard__title', text: '券種 ' + (i + 1) }),
            el('button', {
              class: 'btn btn--danger', text: '削除',
              onclick: function () {
                if (sold > 0) { alert(MSG.ticketDelete); return; }   // D-03
                if (draft.ticketTypes.length <= 1) { alert(MSG.noTicket); return; }
                readTickets();
                draft.ticketTypes.splice(draft.ticketTypes.indexOf(t), 1);
                paintTickets();
              }
            })
          ]),
          nameF, capF, descF,
          el('div', { class: 'field__row' }, [startF, endF]),
          thF
        ]));
      });
    }
    function readTickets() {
      draft.ticketTypes.forEach(function (t) {
        if (!t.__f) return;
        t.name = t.__f.name.__control.value.trim();
        t.capacity = parseInt(t.__f.capacity.__control.value, 10);
        t.description = t.__f.description.__control.value.trim();
        t.salesStart = fromLocalInput(t.__f.salesStart.__control.value);
        t.salesEnd = fromLocalInput(t.__f.salesEnd.__control.value);
        t.lowStockThreshold = parseInt(t.__f.threshold.__control.value, 10);
      });
    }
    paintTickets();

    /* ---------- カスタム項目（T2-3 / D-28） ---------- */
    var fieldHost = el('div');
    function paintFormFields() {
      fieldHost.textContent = '';
      draft.formFields.sort(function (a, b) { return a.order - b.order; });
      draft.formFields.forEach(function (f, i) {
        var labelF = field({ label: '項目名', required: true, help: '申込フォームの入力欄の見出しとして表示されます。' },
          textInput({ placeholder: '例: 所属部署', maxlength: '50', value: f.label }));
        var typeSel = selectInput(FIELD_TYPES, f.type, { class: 'input--sm' });
        var typeF = field({ label: '入力形式' }, typeSel);
        var optInput = textInput({ placeholder: '例: 1年未満, 1〜3年, 3年以上', value: (f.options || []).join(', ') });
        var optF = field({ label: '選択肢', help: 'カンマ区切りで入力します。1件30文字まで、最大10件。' }, optInput);
        var reqInput = el('input', { type: 'checkbox' });
        reqInput.checked = !!f.required;
        var reqF = field({ label: '必須にする', help: 'オンにすると、この項目が空のままでは申し込めません。' },
          el('label', { class: 'radio' }, [reqInput, document.createTextNode('必須')]));

        function syncType() {
          var needsOptions = ['select', 'radio'].indexOf(typeSel.value) >= 0;
          optF.style.display = needsOptions ? '' : 'none';
        }
        typeSel.addEventListener('change', syncType);
        syncType();

        f.__f = { label: labelF, type: typeF, options: optF, required: reqF, typeSel: typeSel, reqInput: reqInput, optInput: optInput };

        fieldHost.appendChild(el('div', { class: 'subcard' }, [
          el('div', { class: 'subcard__head' }, [
            el('div', { class: 'subcard__title', text: '項目 ' + (i + 1) }),
            el('div', { class: 'stack' }, [
              el('button', { class: 'btn', text: '↑', disabled: i === 0 ? 'disabled' : null,
                onclick: function () { readFormFields(); swapOrder(i, i - 1); } }),
              el('button', { class: 'btn', text: '↓', disabled: i === draft.formFields.length - 1 ? 'disabled' : null,
                onclick: function () { readFormFields(); swapOrder(i, i + 1); } }),
              el('button', { class: 'btn btn--danger', text: '削除',
                onclick: function () {
                  readFormFields();
                  draft.formFields.splice(draft.formFields.indexOf(f), 1);
                  reorder(); paintFormFields();
                } })
            ])
          ]),
          labelF, typeF, optF, reqF
        ]));
      });
    }
    function swapOrder(a, b) {
      var tmp = draft.formFields[a];
      draft.formFields[a] = draft.formFields[b];
      draft.formFields[b] = tmp;
      reorder(); paintFormFields();
    }
    function reorder() {
      draft.formFields.forEach(function (f, i) { f.order = i + 1; });
    }
    function readFormFields() {
      draft.formFields.forEach(function (f) {
        if (!f.__f) return;
        f.label = f.__f.label.__control.value.trim();
        f.type = f.__f.typeSel.value;
        f.required = f.__f.reqInput.checked;
        f.options = f.__f.optInput.value.split(',').map(function (s) { return s.trim(); })
          .filter(function (s) { return s !== ''; });
      });
    }
    paintFormFields();

    /* ---------- 収集と検証 ---------- */
    function collect() {
      readTickets();
      readFormFields();
      reorder();
      var format = formatRadio.value();
      return {
        title: fields.title.__control.value.trim(),
        category: fields.category.__control.value,
        startAt: fromLocalInput(fields.startAt.__control.value),
        endAt: fromLocalInput(fields.endAt.__control.value),
        deadline: fromLocalInput(fields.deadline.__control.value),
        format: format,
        venue: format === 'venue' ? fields.venue.__control.value.trim() : '',
        onlineUrl: format === 'online' ? fields.onlineUrl.__control.value.trim() : '',
        description: fields.description.__control.value,
        status: fields.status.__control.value(),
        coverImage: draft.coverImage || null,
        ticketTypes: draft.ticketTypes,
        formFields: draft.formFields
      };
    }

    /* D-01 下書き保存はイベント名のみ必須。公開時に全必須項目を検証する */
    function validate(v, forPublish) {
      var errors = [];
      Object.keys(fields).forEach(function (k) { setFieldError(fields[k], ''); });

      function fail(f, msg) { setFieldError(f, msg); errors.push(msg); }

      if (!v.title) fail(fields.title, MSG.required('イベント名'));
      else if (v.title.length > 100) fail(fields.title, MSG.maxLength('イベント名', 100));

      if (!forPublish) return errors;

      if (!v.category) fail(fields.category, MSG.select('カテゴリ'));
      if (!v.startAt) fail(fields.startAt, MSG.required('開始日時'));
      if (!v.endAt) fail(fields.endAt, MSG.required('終了日時'));
      if (v.startAt && v.endAt && new Date(v.endAt) <= new Date(v.startAt)) {
        fail(fields.endAt, MSG.after('終了日時', '開始日時'));
      }
      if (!v.deadline) fail(fields.deadline, MSG.required('申込締切'));
      if (v.deadline && v.startAt && new Date(v.deadline) > new Date(v.startAt)) {
        fail(fields.deadline, MSG.before('申込締切', '開始日時'));  // D-26
      }
      if (v.format === 'venue' && !v.venue) fail(fields.venue, MSG.required('会場名・住所'));
      if (v.format === 'venue' && v.venue.length > 200) fail(fields.venue, MSG.maxLength('会場名・住所', 200));
      if (v.format === 'online') {
        if (!v.onlineUrl) fail(fields.onlineUrl, MSG.required('視聴URL'));
        else if (!/^https?:\/\/.+/.test(v.onlineUrl)) fail(fields.onlineUrl, MSG.format('視聴URL'));
      }
      if (!v.description) fail(fields.description, MSG.required('説明文'));
      else if (v.description.length > 2000) fail(fields.description, MSG.maxLength('説明文', 2000));

      // D-05 券種ゼロでは公開できない
      if (v.ticketTypes.length === 0) errors.push(MSG.noTicket);

      v.ticketTypes.forEach(function (t, i) {
        var tag = '券種' + (i + 1) + 'の';
        if (!t.name) fail(t.__f.name, MSG.required(tag + '券種名'));
        else if (t.name.length > 50) fail(t.__f.name, MSG.maxLength(tag + '券種名', 50));

        if (!(t.capacity >= 1 && t.capacity <= 9999)) {          // D-22
          fail(t.__f.capacity, MSG.range(tag + '定員', 1, 9999));
        } else {
          var sold = confirmedCount(entries, id, t.id);           // D-02
          if (t.capacity < sold) fail(t.__f.capacity, MSG.capacityShrink(sold));
        }
        if (!(t.lowStockThreshold >= 0 && t.lowStockThreshold <= 9999)) {  // D-25
          fail(t.__f.threshold, MSG.range(tag + '残席表示の閾値', 0, 9999));
        }
        if (t.salesStart && t.salesEnd && new Date(t.salesEnd) <= new Date(t.salesStart)) {
          fail(t.__f.salesEnd, MSG.after(tag + '販売終了', '販売開始'));
        }
        if (t.salesEnd && v.deadline && new Date(t.salesEnd) > new Date(v.deadline)) {  // D-24
          fail(t.__f.salesEnd, MSG.before(tag + '販売終了', '申込締切'));
        }
      });

      // D-28 カスタム項目
      if (v.formFields.length > MAX_FORM_FIELDS) {
        errors.push('カスタム項目は' + MAX_FORM_FIELDS + '件以内で設定してください');
      }
      v.formFields.forEach(function (f, i) {
        var tag = 'カスタム項目' + (i + 1) + 'の';
        if (!f.label) fail(f.__f.label, MSG.required(tag + '項目名'));
        else if (f.label.length > 50) fail(f.__f.label, MSG.maxLength(tag + '項目名', 50));
        if (['select', 'radio'].indexOf(f.type) >= 0) {
          if (f.options.length === 0) fail(f.__f.options, MSG.required(tag + '選択肢'));
          else if (f.options.length > MAX_FIELD_OPTIONS) {
            fail(f.__f.options, tag + '選択肢は' + MAX_FIELD_OPTIONS + '件以内で入力してください');
          } else if (f.options.some(function (o) { return o.length > 30; })) {
            fail(f.__f.options, tag + '選択肢は1件30文字以内で入力してください');
          }
        }
      });

      return errors;
    }

    function save(nextStatus) {
      // ボタンの操作を D-29 の公開状態ラジオへ反映し、表示と保存内容を一致させる
      fields.status.__control.setValue(nextStatus);
      var v = collect();
      var forPublish = v.status === 'published';
      var errors = validate(v, forPublish);

      summaryHost.textContent = '';
      if (errors.length > 0) {
        summaryHost.appendChild(errorSummary(errors));
        summaryHost.scrollIntoView({ block: 'nearest' });
        return;
      }

      var now = iso(Date.now());
      var record = Object.assign({}, res[0] || {}, v, {
        id: id || uid('ev'),
        seriesId: draft.seriesId || null,
        createdAt: (res[0] && res[0].createdAt) || now,
        updatedAt: now
      });
      // 保存用に内部作業プロパティを落とす
      record.ticketTypes = v.ticketTypes.map(function (t) {
        return { id: t.id, name: t.name, capacity: t.capacity, description: t.description,
                 salesStart: t.salesStart, salesEnd: t.salesEnd, lowStockThreshold: t.lowStockThreshold };
      });
      record.formFields = v.formFields.map(function (f) {
        return { id: f.id, label: f.label, type: f.type, options: f.options,
                 required: f.required, order: f.order };
      });

      store.put(STORE_EVENTS, record).then(function () {
        toast(isNew ? 'イベントを作成しました。' : 'イベントを保存しました。');
        navigate('/events/' + record.id);
      });
    }

    /* ---------- 組み立て ---------- */
    body.appendChild(summaryHost);
    body.appendChild(el('p', { class: 'muted',
      text: '「*」の付いた項目は公開時に必須です。下書きのまま保存する場合はイベント名だけで保存できます。' }));
    body.appendChild(fields.title);
    body.appendChild(fields.category);
    body.appendChild(fields.startAt);
    body.appendChild(fields.endAt);
    body.appendChild(fields.deadline);
    body.appendChild(fields.coverImage);

    body.appendChild(el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: '会場・配信' }),
      fields.format, venueField, onlineField
    ]));

    body.appendChild(el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: '詳細' }),
      fields.description
    ]));

    body.appendChild(el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: '券種' }),
      el('p', { class: 'section__note', text: '公開するには券種が1件以上必要です。定員は券種ごとに判定されます。' }),
      ticketHost,
      el('button', {
        class: 'btn', text: '券種を追加',
        onclick: function () {
          readTickets();
          draft.ticketTypes.push(makeTicketType('一般', 20));
          paintTickets();
        }
      })
    ]));

    body.appendChild(el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: '申込フォームのカスタム項目' }),
      el('p', { class: 'section__note',
        text: '氏名とメールアドレスは常に必須項目として取得します。ここでは追加で聞きたいことだけを設定してください（最大' + MAX_FORM_FIELDS + '件）。' }),
      fieldHost,
      el('button', {
        class: 'btn', text: '項目を追加',
        onclick: function () {
          readFormFields();
          if (draft.formFields.length >= MAX_FORM_FIELDS) {
            alert('カスタム項目は' + MAX_FORM_FIELDS + '件以内で設定してください');
            return;
          }
          draft.formFields.push({ id: uid('ff'), label: '', type: 'text', options: [],
                                  required: false, order: draft.formFields.length + 1 });
          paintFormFields();
        }
      })
    ]));

    body.appendChild(el('div', { class: 'section' }, [
      el('h2', { class: 'section__title', text: '公開状態' }),
      fields.status
    ]));

    syncFormat();

    return el('div', {}, [
      pageHead(isNew ? 'イベントを作成' : 'イベントを編集', [
        el('a', { class: 'btn', href: id ? '#/events/' + id : '#/events', text: 'やめる' })
      ]),
      body,
      el('div', { class: 'formbar' }, [
        el('button', { class: 'btn', text: '下書きとして保存', onclick: function () { save('draft'); } }),
        el('button', { class: 'btn btn--primary', text: '公開する', onclick: function () { save('published'); } }),
        el('span', { class: 'muted', text: '公開すると公開イベント一覧に載り、申込を受け付けます。' })
      ])
    ]);
  });
}

function renderEventDetail(id) {
  return Promise.all([
    store.get(STORE_EVENTS, id),
    store.byIndex(STORE_ENTRIES, 'eventId', id),
    getSetting('mailTemplates')
  ]).then(function (res) {
    var ev = res[0], entries = res[1], templates = res[2] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    var st = eventStatusLabel(ev);
    var confirmed = confirmedCount(entries, ev.id);
    var capacity = eventCapacity(ev);

    /* F-10 共有リンクの生成
       `file://` は他者からアクセスできないため、文字列を生成するところまでのモックである。
       Webサーバへホスティングすれば同じハッシュルートがそのまま共有URLになる（仕様書 8章 #3） */
    function shareLink() {
      var url = location.href.split('#')[0] + '#/public/' + ev.id;
      var area = el('textarea', { style: 'min-height:80px' });
      area.value = url;
      openModal('共有リンクを生成', [
        el('div', { class: 'alert alert--danger',
          text: 'このリンクは同じ端末の同じファイルでしか開けません。file:// では他の人に共有できないため、リンクの生成までのモックです。' }),
        el('p', { class: 'muted', text: 'Webサーバ上に置いた場合は、このハッシュ以降がそのまま共有URLになります。' }),
        area
      ], function (close) {
        area.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        close();
        toast(ok ? '共有リンクをコピーしました。' : 'コピーできませんでした。手動で選択してコピーしてください。');
      }, 'コピーする');
    }

    /* F-29 告知文の生成（まだ申込者がいない段階の告知に使う） */
    function announce() {
      var text = templates.announce
        ? fillTemplate(templates.announce, ev, null)
        : '【' + ev.title + '】\n' +
          formatDateTime(ev.startAt) + ' 〜 ' + formatDateTime(ev.endAt) + '\n' +
          (ev.format === 'online' ? 'オンライン開催（' + (ev.onlineUrl || 'URLは追ってご案内します') + '）'
                                  : '会場: ' + (ev.venue || '追ってご案内します')) + '\n\n' +
          ev.description + '\n\n' +
          '申込締切: ' + formatDateTime(ev.deadline) + '\n' +
          '定員: ' + capacity + '名';
      var area = el('textarea', { style: 'min-height:240px' });
      area.value = text;
      openModal('告知文を生成', [
        el('p', { class: 'muted', text: 'この文面をコピーして、社内SNSやメールに貼って告知してください。文面のひな形は設定・データ管理のメールテンプレートで変更できます。' }),
        area
      ], function (close) {
        area.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        recordSend('告知文', ev.id, ev.title, 0).then(function () {
          close();
          toast(ok ? '告知文をコピーしました。' : 'コピーできませんでした。手動で選択してコピーしてください。');
        });
      }, 'コピーする');
    }

    var ticketRows = (ev.ticketTypes || []).map(function (t) {
      var a = ticketAvailability(ev, t, entries);
      return el('tr', {}, [
        el('td', { text: t.name }),
        el('td', { text: a.sold + ' / ' + t.capacity }),
        el('td', { text: '残 ' + a.remaining }),
        el('td', {}, [a.available
          ? el('span', { class: 'badge badge--success', text: '受付中' })
          : el('span', { class: 'badge badge--neutral', text: a.reason })])
      ]);
    });

    return el('div', {}, [
      pageHead(ev.title, [
        el('a', { class: 'btn', href: '#/public/' + ev.id, text: 'プレビュー' }),
        el('button', { class: 'btn', text: '共有リンクを生成', onclick: shareLink }),
        el('button', { class: 'btn', text: '告知文を生成', onclick: announce }),
        el('a', { class: 'btn', href: '#/events/' + ev.id + '/entries', text: '参加者一覧' }),
        el('a', { class: 'btn btn--primary', href: '#/events/' + ev.id + '/edit', text: '編集' })
      ]),
      el('div', { class: 'card' }, [
        el('table', {}, [el('tbody', {}, [
          el('tr', {}, [el('th', { text: '状態' }),
            el('td', {}, [el('span', { class: 'badge ' + st.cls, text: st.text })])]),
          statRow('申込 / 定員', confirmed + ' / ' + capacity),
          statRow('カテゴリ', ev.category),
          statRow('開催形式', ev.format === 'online' ? 'オンライン' : '会場'),
          statRow('会場 / 視聴URL', ev.format === 'online' ? (ev.onlineUrl || '—') : (ev.venue || '—')),
          statRow('開催日時', formatDateTime(ev.startAt) + ' 〜 ' + formatDateTime(ev.endAt)),
          statRow('申込締切', formatDateTime(ev.deadline)),
          statRow('カスタム項目', (ev.formFields || []).length + ' 件')
        ])])
      ]),
      el('div', { class: 'card' }, [
        el('h2', { class: 'section__title', text: '券種' }),
        ticketRows.length === 0
          ? el('div', { class: 'empty', text: '券種が登録されていません。公開するには1件以上必要です。' })
          : el('table', {}, [
              el('thead', {}, [el('tr', {}, [
                el('th', { text: '券種' }), el('th', { text: '申込 / 定員' }),
                el('th', { text: '残席' }), el('th', { text: '状態' })
              ])]),
              el('tbody', {}, ticketRows)
            ])
      ])
      // F-34（余力枠・未実装）: 仕様書 5.5 の既定挙動どおり、運用ファイル管理タブは表示しない
    ]);
  });
}

/* ------------------------------------------------------------
   F-19 文面生成 — イベント情報を差し込む共通処理
   F-19（文面）/ F-28（宛先を選んで送る）/ F-29（告知文）が共有する
   ------------------------------------------------------------ */
function fillTemplate(template, event, entry) {
  var place = event.format === 'online' ? (event.onlineUrl || '') : (event.venue || '');
  return String(template || '')
    .replace(/\{イベント名\}/g, event.title)
    .replace(/\{開催日時\}/g, formatDateTime(event.startAt) + ' 〜 ' + formatDateTime(event.endAt))
    .replace(/\{場所\}/g, place)
    .replace(/\{受付コード\}/g, entry ? entry.code : '')
    .replace(/\{氏名\}/g, entry ? entry.name : '');
}

function defaultInviteBody(event, entry) {
  return (entry ? entry.name + ' 様\n\n' : '') +
    event.title + ' についてご連絡します。\n\n' +
    '開催日時: ' + formatDateTime(event.startAt) + ' 〜 ' + formatDateTime(event.endAt) + '\n' +
    '場所: ' + (event.format === 'online' ? (event.onlineUrl || '') : (event.venue || '')) + '\n' +
    (entry ? '受付コード: ' + entry.code + '\n' : '');
}

/* F-19 送信履歴の記録 */
function recordSend(kind, eventId, subject, recipientCount) {
  return getSetting('sendLog').then(function (log) {
    var next = (log || []).concat([{
      id: uid('log'), sentAt: iso(Date.now()), eventId: eventId,
      kind: kind, subject: subject, recipientCount: recipientCount
    }]);
    return setSetting('sendLog', next);
  });
}

/* mailto: で既定メーラーを起動する。実送信はブラウザからは行えない */
function openMailto(recipients, subject, body) {
  var to = recipients.length === 1 ? encodeURIComponent(recipients[0]) : '';
  var bcc = recipients.length > 1 ? '&bcc=' + encodeURIComponent(recipients.join(',')) : '';
  var href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body) + bcc;
  location.href = href;
}

/* ------------------------------------------------------------
   S-08 参加者一覧／受付
   F-15 検索・ページング / F-16 チェックイン / F-17 CSV / F-30 編集 / F-13 キャンセル / F-28 送信
   ------------------------------------------------------------ */
var ENTRIES_PER_PAGE = 25;
var entryListState = { q: '', state: '', checkin: '', page: 1 };

function renderEntryList(eventId) {
  return Promise.all([
    store.get(STORE_EVENTS, eventId),
    store.byIndex(STORE_ENTRIES, 'eventId', eventId),
    getSetting('mailTemplates')
  ]).then(function (res) {
    var ev = res[0], all = res[1], templates = res[2] || {};
    if (!ev) return renderError('指定されたイベントが見つかりません');
    var s = entryListState;

    var ticketName = {};
    (ev.ticketTypes || []).forEach(function (t) { ticketName[t.id] = t.name; });

    var filtered = all.filter(function (e) {
      if (s.q) {
        var q = s.q.toLowerCase();
        var hit = e.name.toLowerCase().indexOf(q) >= 0 ||
                  e.email.toLowerCase().indexOf(q) >= 0 ||
                  e.code.toLowerCase().indexOf(q) >= 0;
        if (!hit) return false;
      }
      if (s.state && e.state !== s.state) return false;
      if (s.checkin === 'done' && !e.checkedInAt) return false;
      if (s.checkin === 'yet' && e.checkedInAt) return false;
      return true;
    });
    // D-36 参加者一覧＝申込日時の昇順
    filtered.sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });

    var totalPages = Math.max(1, Math.ceil(filtered.length / ENTRIES_PER_PAGE));
    if (s.page > totalPages) s.page = totalPages;
    var pageItems = filtered.slice((s.page - 1) * ENTRIES_PER_PAGE, s.page * ENTRIES_PER_PAGE);

    var qInput = textInput({ placeholder: '例: 山田 / example.com / H7K2M9XQ', value: s.q });
    qInput.addEventListener('input', function () {
      s.q = qInput.value; s.page = 1; s.focus = true; router();
    });
    if (s.focus) {
      setTimeout(function () {
        qInput.focus(); qInput.setSelectionRange(qInput.value.length, qInput.value.length);
      }, 0);
    }
    var stateSel = selectInput([
      { value: '', label: 'すべての状態' },
      { value: 'confirmed', label: '参加確定' },
      { value: 'cancelled', label: 'キャンセル済み' }
    ], s.state);
    stateSel.addEventListener('change', function () { s.state = stateSel.value; s.page = 1; router(); });

    var checkinSel = selectInput([
      { value: '', label: '受付状況すべて' },
      { value: 'done', label: '受付済み' },
      { value: 'yet', label: '未受付' }
    ], s.checkin);
    checkinSel.addEventListener('change', function () { s.checkin = checkinSel.value; s.page = 1; router(); });

    var confirmed = all.filter(function (e) { return e.state === 'confirmed'; });
    var checkedIn = confirmed.filter(function (e) { return e.checkedInAt; });

    /* F-16 チェックイン */
    function toggleCheckIn(entry) {
      var now = iso(Date.now());
      store.put(STORE_ENTRIES, Object.assign({}, entry, {
        checkedInAt: entry.checkedInAt ? null : now, updatedAt: now
      })).then(function () {
        toast(entry.checkedInAt ? '受付を取り消しました。' : entry.name + ' さんを受付しました。');
        router();
      });
    }

    /* F-13 主催者側からのキャンセル（D-10 チェックイン済みでも主催者は可能） */
    function cancelEntry(entry) {
      if (!confirm(entry.name + ' さんのお申込みをキャンセルします。よろしいですか？')) return;
      var now = iso(Date.now());
      store.put(STORE_ENTRIES, Object.assign({}, entry, {
        state: 'cancelled', cancelledAt: now, updatedAt: now
      })).then(function () { toast('キャンセルしました。'); router(); });
    }

    /* F-30 参加者情報の編集 */
    function editEntry(entry) {
      var nameF = field({ label: '氏名', required: true, help: '受付時の照合に使われます。' },
        textInput({ maxlength: '50', value: entry.name }));
      var mailF = field({ label: 'メールアドレス', required: true, help: '申込照会とご連絡に使われます。誤入力はここで修正できます。' },
        el('input', { type: 'email', maxlength: '254', value: entry.email }));
      var custom = {};
      var customHost = el('div');
      (ev.formFields || []).slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (f) {
        var saved = entry.answers ? entry.answers[f.id] : '';
        var control;
        if (f.type === 'checkbox') {
          var cb = el('input', { type: 'checkbox' });
          cb.checked = saved === true || saved === 'true';
          control = el('label', { class: 'radio' }, [cb, document.createTextNode('はい')]);
          control.__cb = cb;
        } else if (f.type === 'select') {
          control = selectInput([{ value: '', label: '選択してください' }].concat(
            f.options.map(function (o) { return { value: o, label: o }; })), saved || '', { class: 'input--sm' });
        } else if (f.type === 'radio') {
          control = radioInput('ed_' + f.id, f.options.map(function (o) { return { value: o, label: o }; }), saved || '');
        } else if (f.type === 'textarea') {
          control = el('textarea', {}); control.value = saved || '';
        } else {
          control = textInput({ maxlength: '200', value: saved || '' });
        }
        var node = field({ label: f.label, required: f.required }, control);
        custom[f.id] = { def: f, node: node, control: control };
        customHost.appendChild(node);
      });

      openModal('参加者情報の編集', [nameF, mailF, customHost], function (close) {
        setFieldError(nameF, ''); setFieldError(mailF, '');
        var name = nameF.__control.value.trim();
        var email = mailF.__control.value.trim();
        if (!name) { setFieldError(nameF, MSG.required('氏名')); return; }
        if (name.length > 50) { setFieldError(nameF, MSG.maxLength('氏名', 50)); return; }
        if (!email) { setFieldError(mailF, MSG.required('メールアドレス')); return; }
        if (!/^[^\s@]+@[^\s@]+$/.test(email)) { setFieldError(mailF, MSG.format('メールアドレス')); return; }
        var dup = all.some(function (e) {
          return e.id !== entry.id && e.state === 'confirmed' &&
                 e.email.toLowerCase() === email.toLowerCase();
        });
        if (dup && entry.state === 'confirmed') {
          setFieldError(mailF, 'このメールアドレスはすでに申し込まれています'); return;
        }
        var answers = {};
        Object.keys(custom).forEach(function (id) {
          var c = custom[id];
          if (c.def.type === 'checkbox') answers[id] = c.control.__cb.checked;
          else if (c.def.type === 'radio') answers[id] = c.control.value();
          else answers[id] = c.control.value;
        });
        var now = iso(Date.now());
        store.put(STORE_ENTRIES, Object.assign({}, entry, {
          name: name, email: email, answers: answers, updatedAt: now
        })).then(function () { close(); toast('参加者情報を更新しました。'); router(); });
      });
    }

    /* F-28 メッセージ送信（個別／絞り込み結果／全員） */
    function sendMessage(scope, targets) {
      var recipients = targets.filter(function (e) { return e.state === 'confirmed'; });
      if (recipients.length === 0) { alert('宛先になる参加者がいません。'); return; }
      var subjF = field({ label: '件名', required: true },
        textInput({ value: '【' + ev.title + '】ご連絡' }));
      var bodyF = field({ label: '本文', required: true,
          help: '既定のメールソフトが起動します。本システムから直接送信することはできません。' },
        el('textarea', {}));
      bodyF.__control.value = templates.invite
        ? fillTemplate(templates.invite, ev, recipients.length === 1 ? recipients[0] : null)
        : defaultInviteBody(ev, recipients.length === 1 ? recipients[0] : null);

      openModal('メッセージ送信（' + scope + '・' + recipients.length + '件）', [
        el('p', { class: 'muted', text: recipients.length > 1
          ? '宛先は BCC に入ります。メールソフトによっては宛先数に上限があります。'
          : '宛先: ' + recipients[0].email }),
        subjF, bodyF
      ], function (close) {
        setFieldError(subjF, ''); setFieldError(bodyF, '');
        var subject = subjF.__control.value.trim();
        if (!subject) { setFieldError(subjF, MSG.required('件名')); return; }
        var body = bodyF.__control.value;
        if (!body.trim()) { setFieldError(bodyF, MSG.required('本文')); return; }
        recordSend(scope, ev.id, subject, recipients.length).then(function () {
          openMailto(recipients.map(function (e) { return e.email; }), subject, body);
          close();
          toast('メールソフトを起動し、送信履歴に記録しました。');
        });
      }, 'メールソフトを起動');
    }

    /* F-17 CSV出力（全状態を含む・UTF-8 BOM付き） */
    function exportCsv() {
      var customDefs = (ev.formFields || []).slice().sort(function (a, b) { return a.order - b.order; });
      var header = ['受付コード', '氏名', 'メールアドレス', '券種', '状態', '申込日時', '受付日時', '取消日時']
        .concat(customDefs.map(function (f) { return f.label; }));
      var stateText = { confirmed: '参加確定', cancelled: 'キャンセル済み' };
      var rows = all.slice().sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); })
        .map(function (e) {
          return [
            e.code, e.name, e.email, ticketName[e.ticketTypeId] || '',
            stateText[e.state] || e.state,
            formatDateTime(e.createdAt),
            e.checkedInAt ? formatDateTime(e.checkedInAt) : '',
            e.cancelledAt ? formatDateTime(e.cancelledAt) : ''
          ].concat(customDefs.map(function (f) {
            var v = e.answers ? e.answers[f.id] : '';
            if (f.type === 'checkbox') return v ? 'はい' : 'いいえ';
            return v === undefined || v === null ? '' : String(v);
          }));
        });
      var esc = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
      var csv = [header].concat(rows).map(function (r) { return r.map(esc).join(','); }).join('\r\n');
      downloadFile(ev.title + '_参加者.csv', '﻿' + csv, 'text/csv;charset=utf-8');
      toast('CSVを出力しました（' + rows.length + '件）。');
    }

    var stateBadge = {
      confirmed: ['参加確定', 'badge--success'],
      cancelled: ['キャンセル済み', 'badge--danger']
    };
    var body = pageItems.map(function (en) {
      var sb = stateBadge[en.state] || ['—', 'badge--neutral'];
      return el('tr', {}, [
        el('td', { text: en.code }),
        el('td', { text: en.name }),
        el('td', { text: en.email }),
        el('td', { text: ticketName[en.ticketTypeId] || '—' }),
        el('td', {}, [el('span', { class: 'badge ' + sb[1], text: sb[0] })]),
        el('td', { text: en.checkedInAt ? formatDateTime(en.checkedInAt) : '—' }),
        el('td', {}, [el('div', { class: 'stack' }, [
          en.state === 'confirmed'
            ? el('button', { class: 'btn' + (en.checkedInAt ? '' : ' btn--primary'),
                text: en.checkedInAt ? '受付取消' : '受付',
                onclick: function () { toggleCheckIn(en); } })
            : null,
          el('button', { class: 'btn', text: '編集', onclick: function () { editEntry(en); } }),
          en.state === 'confirmed'
            ? el('button', { class: 'btn', text: 'メール',
                onclick: function () { sendMessage('個別', [en]); } })
            : null,
          en.state === 'confirmed'
            ? el('button', { class: 'btn btn--danger', text: 'キャンセル',
                onclick: function () { cancelEntry(en); } })
            : null
        ])])
      ]);
    });

    var pager = el('div', { class: 'pager' }, [
      el('span', { class: 'muted', text: filtered.length + ' 件中 ' +
        (filtered.length === 0 ? 0 : (s.page - 1) * ENTRIES_PER_PAGE + 1) + '〜' +
        Math.min(s.page * ENTRIES_PER_PAGE, filtered.length) + ' 件' }),
      el('button', { class: 'btn', text: '前へ', disabled: s.page <= 1 ? 'disabled' : null,
        onclick: function () { s.page--; router(); } }),
      el('span', { text: s.page + ' / ' + totalPages }),
      el('button', { class: 'btn', text: '次へ', disabled: s.page >= totalPages ? 'disabled' : null,
        onclick: function () { s.page++; router(); } })
    ]);

    return el('div', {}, [
      pageHead(ev.title + ' — 参加者', [
        el('a', { class: 'btn', href: '#/events/' + ev.id, text: 'イベント詳細へ' })
      ]),
      el('div', { class: 'card' }, [
        el('table', {}, [el('tbody', {}, [
          statRow('参加確定', confirmed.length + ' 件 / 定員 ' + eventCapacity(ev) + ' 名'),
          statRow('受付済み', checkedIn.length + ' 件' +
            (confirmed.length > 0 ? '（チェックイン率 ' + Math.round(checkedIn.length / confirmed.length * 100) + '%）' : '')),
          statRow('キャンセル', all.filter(function (e) { return e.state === 'cancelled'; }).length + ' 件')
        ])])
      ]),
      el('div', { class: 'card' }, [
        el('div', { class: 'toolbar' }, [
          qInput, stateSel, checkinSel,
          el('button', { class: 'btn', text: 'CSVを出力', onclick: exportCsv }),
          el('button', { class: 'btn', text: '絞り込み結果へメール',
            onclick: function () { sendMessage('絞り込み結果', filtered); } }),
          el('button', { class: 'btn', text: '全員へメール',
            onclick: function () { sendMessage('全員', all); } })
        ]),
        filtered.length === 0
          ? el('div', { class: 'empty', text: all.length === 0
              ? 'まだ申込がありません。' : '条件に一致する参加者がいません。' })
          : el('div', {}, [
              el('table', {}, [
                el('thead', {}, [el('tr', {}, [
                  el('th', { text: '受付コード' }), el('th', { text: '氏名' }),
                  el('th', { text: 'メールアドレス' }), el('th', { text: '券種' }),
                  el('th', { text: '状態' }), el('th', { text: '受付' }), el('th', { text: '' })
                ])]),
                el('tbody', {}, body)
              ]),
              pager
            ])
      ])
    ]);
  });
}

/* ------------------------------------------------------------
   F-20 JSONエクスポート／インポート
   Blob はそのまま JSON 化できないため base64 に変換する（仕様書 6.6）
   ------------------------------------------------------------ */
function blobToJson(blob) {
  if (!blob) return Promise.resolve(null);
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('画像の書き出しに失敗しました')); };
    reader.onload = function () {
      resolve({ __blob: true, mime: blob.type, data: String(reader.result).split(',')[1] });
    };
    reader.readAsDataURL(blob);
  });
}

function jsonToBlob(value) {
  if (!value || !value.__blob) return null;
  var bin = atob(value.data);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: value.mime });
}

function exportAllData(includeFiles) {
  return Promise.all([
    storeGetAllRaw(STORE_EVENTS), storeGetAllRaw(STORE_ENTRIES),
    storeGetAllRaw(STORE_SETTINGS), storeGetAllRaw(STORE_FILES)
  ]).then(function (res) {
    var events = res[0], entries = res[1], settings = res[2], files = res[3];
    // events の Blob（coverImage）を base64 化
    var evJobs = events.map(function (ev) {
      var copy = Object.assign({}, ev);
      return blobToJson(ev.coverImage).then(function (cover) {
        copy.coverImage = cover;
        return copy;
      });
    });
    // settings.org の Blob（logo / headerImage）を base64 化
    var stJobs = settings.map(function (row) {
      if (row.key !== 'org' || !row.value) return Promise.resolve(row);
      var org = row.value;
      return Promise.all([blobToJson(org.logo), blobToJson(org.headerImage)])
        .then(function (b) {
          return { key: 'org', value: Object.assign({}, org, { logo: b[0], headerImage: b[1] }) };
        });
    });
    // files は肥大化するため既定では含めない（5MB×20件で JSON.stringify が破綻する）
    var fileJobs = includeFiles
      ? files.map(function (f) {
          return blobToJson(f.blob).then(function (b) { return Object.assign({}, f, { blob: b }); });
        })
      : [];
    return Promise.all([Promise.all(evJobs), Promise.all(stJobs), Promise.all(fileJobs)])
      .then(function (r) {
        return {
          format: 'event-manager-db',
          schemaVersion: DB_VERSION,
          exportedAt: iso(Date.now()),
          includesFiles: !!includeFiles,
          events: r[0],
          entries: entries,
          settings: r[1],
          files: r[2]
        };
      });
  });
}

function importAllData(payload) {
  if (!payload || payload.format !== 'event-manager-db') {
    return Promise.reject(new Error('このファイルは本システムのバックアップではありません'));
  }
  if (payload.schemaVersion > DB_VERSION) {
    return Promise.reject(new Error('より新しいバージョンで書き出されたため読み込めません'));
  }
  var events = (payload.events || []).map(function (ev) {
    var copy = Object.assign({}, ev);
    copy.coverImage = jsonToBlob(ev.coverImage);
    delete copy.attachments;   // v1.16 で files ストアへ移行
    return copy;
  });
  var files = (payload.files || []).map(function (f) {
    return Object.assign({}, f, { blob: jsonToBlob(f.blob) });
  });
  var settings = (payload.settings || []).map(function (row) {
    if (row.key !== 'org' || !row.value) return row;
    return { key: 'org', value: Object.assign({}, row.value, {
      logo: jsonToBlob(row.value.logo), headerImage: jsonToBlob(row.value.headerImage)
    }) };
  });

  // 資料を含まない書き出しを読み込むときは、既存の資料を消さない
  var clears = [store.clear(STORE_EVENTS), store.clear(STORE_ENTRIES), store.clear(STORE_SETTINGS)];
  if (payload.includesFiles) clears.push(store.clear(STORE_FILES));

  return Promise.all(clears)
    .then(function () {
      return Promise.all([].concat(
        events.map(function (e) { return store.put(STORE_EVENTS, e); }),
        (payload.entries || []).map(function (e) { return store.put(STORE_ENTRIES, e); }),
        settings.map(function (r) { return store.put(STORE_SETTINGS, r); }),
        files.map(function (f) { return store.put(STORE_FILES, f); })
      ));
    })
    .then(ensureSettings)
    .then(function () {
      return { events: events.length, entries: (payload.entries || []).length, files: files.length };
    });
}

/* ブラウザからのファイル保存（外部通信は行わない） */
function downloadFile(filename, content, mime) {
  var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = el('a', { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ------------------------------------------------------------
   S-09 設定・データ管理（仕様書 5.3 のタブ構成）
   ------------------------------------------------------------ */
var SETTINGS_TABS = [
  { key: 'general',   label: '一般設定' },
  { key: 'categories', label: 'カテゴリ管理' },
  { key: 'formFields', label: 'フォーム既定値' },
  { key: 'mail',      label: 'メールテンプレート' },
  { key: 'sendLog',   label: '送信履歴' },
  { key: 'passcode',  label: 'パスコード変更' },
  { key: 'data',      label: 'データ管理' }
];

function renderSettings() {
  return Promise.all([
    getSetting('org'), getSetting('categories'), getSetting('defaultFormFields'),
    getSetting('mailTemplates'), getSetting('sendLog'), getSetting('uiState'),
    storeGetAllRaw(STORE_EVENTS)
  ]).then(function (res) {
    var org = res[0] || {}, categories = (res[1] || []).slice(),
        defaultFormFields = res[2] || [], mailTemplates = res[3] || {},
        sendLog = res[4] || [], uiState = res[5] || {}, events = res[6];

    var active = uiState.lastTab || 'general';
    if (!SETTINGS_TABS.some(function (t) { return t.key === active; })) active = 'general';

    var host = el('div', { class: 'card' });

    var tabs = el('div', { class: 'toolbar' }, SETTINGS_TABS.map(function (t) {
      return el('button', {
        class: 'btn' + (t.key === active ? ' btn--primary' : ''),
        text: t.label,
        onclick: function () {
          // UI状態は localStorage ではなく settings.uiState に保持する
          setSetting('uiState', Object.assign({}, uiState, { lastTab: t.key })).then(router);
        }
      });
    }));

    var panels = {
      general: function () { return settingsGeneral(org); },
      categories: function () { return settingsCategories(categories, events); },
      formFields: function () { return settingsFormFields(defaultFormFields); },
      mail: function () { return settingsMail(mailTemplates); },
      sendLog: function () { return settingsSendLog(sendLog); },
      passcode: function () { return settingsPasscode(); },
      data: function () { return settingsData(); }
    };
    host.appendChild(panels[active]());

    return el('div', {}, [pageHead('設定・データ管理'), tabs, host]);
  });
}

/* 一般設定 — 組織名は必須機能、ロゴ／ヘッダー画像／紹介文は F-09（余力枠） */
function settingsGeneral(org) {
  var nameF = field(
    { label: '組織名', help: '公開イベント一覧と公開イベントページのヘッダーに表示されます。' },
    textInput({ placeholder: '例: NCT 株式会社', maxlength: '100', value: org.name || '' })
  );

  function imageField(labelText, helpText, key, maxEdge) {
    var preview = el('div');
    var f;
    function paint() {
      preview.textContent = '';
      if (org[key]) {
        preview.appendChild(el('img', { class: 'thumb', src: blobUrl(org[key]), alt: labelText }));
        preview.appendChild(el('button', {
          class: 'btn', text: '削除', onclick: function () { org[key] = null; paint(); }
        }));
      } else {
        preview.appendChild(el('div', { class: 'muted', text: '未設定' }));
      }
    }
    var input = el('input', { type: 'file', accept: IMAGE_MIME.join(',') });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      setFieldError(f, '');
      readAndResizeImage(file, maxEdge).then(function (blob) {
        org[key] = blob; paint();
      }).catch(function (e) { setFieldError(f, e.message); })
        .then(function () { input.value = ''; });
    });
    f = field({ label: labelText, help: helpText }, el('div', {}, [input, preview]));
    paint();
    return f;
  }

  var logoF = imageField('組織ロゴ（D-37）',

/* カテゴリ管理（D-12）— 上限20件・使用中は削除不可 */
function settingsCategories(categories, events) {
  var errorHost = el('div');
  var listHost = el('div');

  function usageCount(name) {
    return events.filter(function (e) { return e.category === name; }).length;
  }

  function save(next) {
    return setSetting('categories', next).then(function () { router(); });
  }

  function paint() {
    listHost.textContent = '';
    if (categories.length === 0) {
      listHost.appendChild(el('div', { class: 'alert alert--danger',
        text: 'カテゴリが1件もありません。この状態ではイベントを作成できません。' }));
      return;
    }
    var rows = categories.map(function (name, i) {
      var used = usageCount(name);
      return el('tr', {}, [
        el('td', { text: name }),
        el('td', { text: used + ' 件' }),
        el('td', {}, [el('div', { class: 'stack' }, [
          el('button', { class: 'btn', text: '↑', disabled: i === 0 ? 'disabled' : null,
            onclick: function () {
              var t = categories[i]; categories[i] = categories[i - 1]; categories[i - 1] = t;
              save(categories);
            } }),
          el('button', { class: 'btn', text: '↓', disabled: i === categories.length - 1 ? 'disabled' : null,
            onclick: function () {
              var t = categories[i]; categories[i] = categories[i + 1]; categories[i + 1] = t;
              save(categories);
            } }),
          el('button', { class: 'btn btn--danger', text: '削除',
            onclick: function () {
              if (used > 0) { alert(MSG.categoryInUse); return; }
              categories.splice(i, 1);
              save(categories);
            } })
        ])])
      ]);
    });
    listHost.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: 'カテゴリ名' }), el('th', { text: '使用中のイベント' }), el('th', { text: '' })
      ])]),
      el('tbody', {}, rows)
    ]));
  }

  var addField = field(
    { label: 'カテゴリを追加', help: 'イベント作成画面の「カテゴリ」の選択肢と、公開イベント一覧の絞り込みに使われます。' },
    textInput({ placeholder: '例: 勉強会', maxlength: '30' })
  );
  var addBtn = el('button', {
    class: 'btn btn--primary', text: '追加',
    onclick: function () {
      var v = addField.__control.value.trim();
      setFieldError(addField, '');
      if (!v) { setFieldError(addField, MSG.required('カテゴリ名')); return; }
      if (v.length > 30) { setFieldError(addField, MSG.maxLength('カテゴリ名', 30)); return; }
      if (categories.indexOf(v) >= 0) { setFieldError(addField, 'このカテゴリはすでに登録されています'); return; }
      if (categories.length >= MAX_CATEGORIES) {
        setFieldError(addField, 'カテゴリは' + MAX_CATEGORIES + '件以内で登録してください');
        return;
      }
      categories.push(v);
      save(categories);
    }
  });

  paint();
  return el('div', {}, [
    el('p', { class: 'muted', text: '登録上限は' + MAX_CATEGORIES + '件です。使用中のカテゴリは削除できません。' }),
    errorHost, listHost,
    el('div', { class: 'section' }, [addField, addBtn])
  ]);
}
